<title>Wartales Build Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column of framed campaign panels, like the in-game character sheet; sticky roster bar, level rail of diamonds, one panel per milestone. Single dark look by design, matching the game UI. */
:root {
  --bg: #110e0b;          /* charred oak */
  --panel: #1c1813;
  --panel-2: #241e17;
  --edge: #5c4a33;        /* bronze trim */
  --edge-hi: #8a6f48;
  --gold: #d6b06a;        /* accent: Valor gold */
  --gold-hi: #f2d89a;
  --ink: #eadfc7;         /* parchment text */
  --muted: #a6977b;
  --blood: #d0583e;
  --moss: #9cbb72;
  --display: "Cinzel", "Trajan Pro", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  background: radial-gradient(120% 70% at 50% 0%, #2a2118 0%, var(--bg) 60%) fixed, var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img { image-rendering: auto; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: linear-gradient(#221c15, #17130f); border-bottom: 1px solid var(--edge); box-shadow: 0 1px 0 #000, 0 6px 16px rgba(0,0,0,.5);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; line-height: 1; white-space: nowrap; margin-right: auto; color: var(--gold-hi); text-transform: uppercase; }
.brand small { display: block; font-family: var(--body); font-weight: 500; font-size: .66rem; letter-spacing: .22em; color: var(--muted); margin-top: 4px; }
.bar select { min-width: 0; max-width: 46vw; padding: 7px 8px; border: 1px solid var(--edge); border-radius: 2px; background: var(--bg); }

main { max-width: 640px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

/* Buttons */
.btn { border: 1px solid var(--edge-hi); background: linear-gradient(#2c241b, #1d1813); border-radius: 2px; padding: 7px 12px;
  font-family: var(--display); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.btn:hover { border-color: var(--gold); color: var(--gold-hi); }
.btn.primary { background: linear-gradient(#8a6a34, #5e4620); border-color: var(--gold); color: #fff4d8; text-shadow: 0 1px 0 #000; }
.btn.danger { color: var(--blood); }
.btn.small { padding: 5px 10px; font-size: .72rem; white-space: nowrap; }

/* Framed panels: thin bronze line, dark gap, faint outer line — the game's double frame */
.sheet, .tier {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--edge);
  box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px rgba(138,111,72,.35), 0 8px 20px rgba(0,0,0,.45);
  border-radius: 3px; position: relative;
}
.sheet { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet::before, .sheet::after, .tier::before, .tier::after {
  content: ""; position: absolute; top: -5px; width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 0 2px var(--bg);
}
.sheet::before, .tier::before { left: -5px; }
.sheet::after, .tier::after { right: -5px; }

.name { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: .02em; border: 0; border-bottom: 1px solid var(--edge); background: transparent; padding: 2px 0 6px; color: var(--gold-hi); }
.namerow { display: flex; gap: 12px; align-items: center; }
.crest { width: 48px; height: 48px; flex: none; border: 1px solid var(--edge-hi); background: radial-gradient(circle, #3a2e20, #17130f); display: grid; place-items: center; transform: rotate(45deg); }
.crest img { width: 30px; height: 30px; transform: rotate(-45deg); filter: invert(1) sepia(.6) saturate(1.6) hue-rotate(-8deg) brightness(.92); }
.title-line { color: var(--muted); font-size: .95rem; letter-spacing: .02em; }
.title-line b { color: var(--gold); font-family: var(--display); font-weight: 700; letter-spacing: .05em; }

.classes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.cls { border: 1px solid var(--edge); background: linear-gradient(#211b15, #16120e); border-radius: 2px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.cls img { width: 26px; height: 26px; filter: invert(1) sepia(.5) saturate(1.2) brightness(.7); }
.cls b { font-family: var(--display); font-weight: 700; font-size: .6rem; letter-spacing: 0; text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cls span { font-size: .72rem; color: var(--muted); line-height: 1.2; }
.cls[aria-pressed="true"] { border-color: var(--gold); background: linear-gradient(#3b2e1c, #221a11); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(214,176,106,.25); }
.cls[aria-pressed="true"] img { filter: invert(1) sepia(.8) saturate(2.4) hue-rotate(-10deg) brightness(.95); }
.cls[aria-pressed="true"] b { color: var(--gold-hi); }
.blurb { font-size: .92rem; color: var(--muted); margin: 0; font-style: italic; }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 14px; margin: 0; padding-top: 10px; border-top: 1px solid rgba(92,74,51,.6); }
.facts div { min-width: 0; }
.facts .wide { grid-column: 1 / -1; }
.facts dt { font-family: var(--display); font-weight: 700; font-size: .62rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.facts dd { margin: 0; font-size: .92rem; }

.levelrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid var(--edge-hi); background: var(--bg); border-radius: 2px; }
.stepper button { width: 44px; height: 44px; border: 0; background: linear-gradient(#2c241b, #1a1510); font-size: 1.3rem; color: var(--gold); }
.stepper output { min-width: 70px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--gold-hi); font-variant-numeric: tabular-nums; line-height: 1; }
.stepper output small { display: block; font-size: .55rem; letter-spacing: .2em; color: var(--muted); margin-bottom: 2px; }
.next { font-size: .95rem; flex: 1; min-width: 160px; }
.next b { color: var(--gold); }
.next strong { color: var(--blood); }

/* Level rail: diamonds on a bronze line */
.rail { position: relative; display: flex; justify-content: space-between; padding: 8px 4px 0; }
.rail::before { content: ""; position: absolute; left: 18px; right: 18px; top: 23px; height: 2px; background: var(--edge); }
.rail .fill { position: absolute; left: 18px; top: 23px; height: 2px; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); box-shadow: 0 0 8px rgba(214,176,106,.5); }
.node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; border: 0; background: none; padding: 0; width: 34px; }
.node i { width: 26px; height: 26px; transform: rotate(45deg); display: grid; place-items: center; border: 1px solid var(--edge-hi); background: var(--panel); }
.node i span { transform: rotate(-45deg); font-style: normal; font-family: var(--display); font-weight: 700; font-size: .72rem; font-variant-numeric: tabular-nums; }
.node small { font-size: .6rem; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }
.node.picked i { border-color: var(--gold); background: linear-gradient(135deg, #8a6a34, #5e4620); color: #fff4d8; }
.node.due i { border-color: var(--blood); color: var(--blood); box-shadow: 0 0 10px rgba(208,88,62,.55); }
.node.planned i { border-color: var(--gold); color: var(--gold); }

/* Milestone panels */
.tier { scroll-margin-top: 84px; }
.tier.due { border-color: var(--blood); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px rgba(208,88,62,.35), 0 0 18px rgba(208,88,62,.18); }
.tier-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px; flex-wrap: wrap; }
.lv { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 1px solid var(--gold); background: radial-gradient(circle, #3b2e1c, #1a140e); transform: rotate(45deg); margin: 4px; }
.lv span { transform: rotate(-45deg); font-family: var(--display); font-weight: 700; font-size: .95rem; color: var(--gold-hi); line-height: 1; text-align: center; }
.lv span small { display: block; font-size: .5rem; letter-spacing: .15em; color: var(--muted); }
.kind { font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; flex: 1; min-width: 0; }
.pill { font-family: var(--display); font-weight: 700; font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; border-radius: 1px; }
.pill.picked { color: var(--moss); } .pill.due { color: var(--blood); } .pill.planned { color: var(--gold); } .pill.open { color: var(--muted); }
.tier-note { padding: 0 16px 10px; margin: 0; font-size: .86rem; color: var(--muted); font-style: italic; }

.opts { display: flex; flex-direction: column; border-top: 1px solid var(--edge); margin: 0 4px; }
.opt { display: grid; grid-template-columns: 52px 1fr; gap: 12px; text-align: left; border: 0; border-bottom: 1px solid rgba(92,74,51,.55); background: transparent; padding: 12px 12px; position: relative; }
.opt:last-child { border-bottom: 0; }
.opt:hover { background: rgba(214,176,106,.05); }
.ico { width: 52px; height: 52px; position: relative; }
.ico img { width: 52px; height: 52px; display: block; filter: saturate(.75) brightness(.8); }
.ico.blank { border: 1px dashed var(--edge-hi); display: grid; place-items: center; color: var(--muted); font-family: var(--display); }
.opt[aria-checked="true"] { background: linear-gradient(90deg, rgba(214,176,106,.18), rgba(214,176,106,.04)); }
.opt[aria-checked="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.opt[aria-checked="true"] .ico img { filter: none; }
.opt[aria-checked="true"] .ico::after { content: ""; position: absolute; inset: -3px; border: 2px solid var(--gold); box-shadow: 0 0 12px rgba(242,216,154,.6); pointer-events: none; }
.opt[aria-checked="true"] .opt-name > b { color: var(--gold-hi); }
.opt-name { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.opt-name > b { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .03em; }
.vp { display: inline-flex; gap: 1px; }
.vp img { width: 17px; height: 17px; }
.tag { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--edge); padding: 0 5px; border-radius: 1px; }
.tag.hidden { color: var(--blood); border-color: var(--blood); }
.opt-desc { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: #cfc3a8; margin-top: 3px; }
.opt-desc em { color: var(--gold); font-style: normal; font-weight: 700; }
.opt-desc .up { display: flex; gap: 6px; align-items: flex-start; font-size: .86rem; color: var(--muted); }
.opt-desc .up img { width: 15px; height: 15px; margin-top: 2px; flex: none; }
.opt-desc .info { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--edge-hi); font-weight: 700; }
.opt-desc .where { color: var(--blood); font-size: .86rem; }
.empty { padding: 12px 16px; font-size: .9rem; color: var(--muted); border-top: 1px solid var(--edge); }
.subhead { padding: 8px 12px 6px; font-family: var(--display); font-weight: 700; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); background: rgba(0,0,0,.3); border-bottom: 1px solid rgba(92,74,51,.55); }

details.add { border-top: 1px solid var(--edge); margin: 0 4px 4px; }
details.add summary { padding: 10px 12px; font-family: var(--display); font-weight: 700; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.addform { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 14px; }
.addform input, .addform textarea, textarea.box { width: 100%; border: 1px solid var(--edge); border-radius: 2px; background: #0d0b09; padding: 8px 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.panel h2 { font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; margin: 0; color: var(--gold-hi); display: flex; align-items: center; gap: 10px; }
.panel h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge-hi), transparent); }
.panel p { margin: 0; font-size: .92rem; color: var(--muted); }
textarea.box { min-height: 96px; resize: vertical; }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; min-height: 80px; }
.status { font-size: .88rem; color: var(--moss); min-height: 1.2em; }
.status.err { color: var(--blood); }
.foot { font-size: .8rem; color: var(--muted); text-align: center; font-style: italic; }
@media (prefers-reduced-motion: no-preference) { .opt, .cls, .btn { transition: background-color .15s, border-color .15s, box-shadow .15s; } }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand">Wartales<small>build planner</small></div>

</div></header>

stance","desc":"Each time the unit takes damage from a skill, you gain 1 VP.","info":"Passive","ic":4},{"id":"warrior-valorous-chain","name":"Valorous Chain","desc":"Every time an attack hits multiple units, you gain 1 VP.","info":"Passive","ic":5},{"id":"warrior-valorous-duel","name":"Valorous Duel","desc":"Every time this unit engages in combat, you gain 1 VP.","info":"Passive","ic":6}]},{"lv":5,"opts":[{"id":"warrior-madness","name":"Madness","desc":"Damage increased by 50% against units with 50% Health or less.","up":"Damage increased by 50% against units with 75% Health or less.","info":"Passive","ic":7},{"id":"warrior-recklessness","name":"Recklessness","desc":"The first attack of each fight deals 100% extra damage.","up":"The first attack of each fight deals 150% extra damage.","info":"Passive","ic":8},{"id":"warrior-fanaticism","name":"Fanaticism","desc":"At the end of their turn, this unit loses 10% of their maximum Health to gain Fury.","up":"At the end of their turn, this unit loses 10% of their maximum Health to gain Fury and 2 Rage.","info":"Passive","ic":9},{"id":"warrior-first-blood","name":"First Blood","desc":"Damage increased by 35% against enemy units with full Health.","up":"Damage increased by 35% against units with full Health. Also applies Fragility for 2 rounds.","info":"Passive","ic":10},{"id":"warrior-expose-wounds","name":"Expose Wounds","desc":"The first time this unit lands a critical hit each round, applies Exposed to the target.","up":"Critical Hit increased by 10%. The first time this unit lands a critical hit each round, applies Exposed to the target.","info":"Passive","ic":11}]},{"lv":8,"opts":[{"id":"warrior-battle-cry","name":"Battle Cry","desc":"The unit and all allies in the area gain Brutality for 2 rounds.","cost":1,"up":"The unit and all allies in the area gain Brutality for 3 rounds and 2 Rage.","info":"12m area (circle around this unit)","ic":12},{"id":"warrior-challenging-shout","name":"Challenging Shout","desc":"Draws all const VALOR_IC = 176, UP_IC = 177;

const T = {
  spec:    { label: "Specialization", short: "Spec", note: "Your specialization sets the unit's class title and the armor it can wear." },
  valor:   { label: "Valor passive", short: "Valor", note: "How this unit earns Valor Points in combat." },
  t5:      { label: "Talent", short: "Talent" },
  t8:      { label: "Talent", short: "Talent" },
  utility: { label: "Utility", short: "Utility" },
  legacy:  { label: "Bravery or retrain", short: "Bravery", note: "Take the class Bravery skill, or pick Class Specialisation to unlock an option you skipped at an earlier level." },
  master:  { label: "Master class", short: "Master", note: "Unlocks a second specialization skill for this class." },
};
for (const c of CLASSES) {
  const kinds = { 2: c.meleeFirst ? "spec" : "valor", 3: c.meleeFirst ? "valor" : "spec", 5: "t5", 8: "t8", 10: "utility", 12: "legacy", 15: "master" };
  for (const t of c.tiers) t.kind = kinds[t.lv];
}
const byId = Object.fromEntries(CLASSES.map(c => [c.id, c]));

/* ---------- State ---------- */
const KEY = "wartales-planner-v1";
const uid = () => Math.random().toString(36).slice(2, 9);
function sample() {
  return {
    active: "ex1",
    builds: [
      { id: "ex1", name: "Example: Berserker", cls: "warrior", level: 6, notes: "Example build. Rename it or tap + New to start your own.",
        picks: { warrior: { 2: "warrior-berserker", 3: "warrior-valorous-duel", 5: "warrior-recklessness", 8: "warrior-battle-cry" } } },
    ],
    custom: {},
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { S = sample(); }
if (!S.builds?.length) S = sample();
S.custom ||= {};
// Drop builds for unknown classes and picks that no longer match an option (e.g. after a data update).
S.builds = S.builds.filter(b => byId[b.cls]);
if (!S.builds.length) S = sample();
for (const b of S.builds) for (const [cid, p] of Object.entries(b.picks || {})) {
  const c = byId[cid];
  for (const lv of Object.keys(p)) if (!c || !findOpt(c, p[lv])) delete p[lv];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const cur = () => S.builds.find(b => b.id === S.active) || S.builds[0];
const picksOf = b => (b.picks[b.cls] ||= {});

function optsFor(cls, tier) {
  const extra = (S.custom[cls.id] && S.custom[cls.id][tier.lv]) || [];
  return [...tier.opts, ...extra.map(o => ({ ...o, custom: true }))];
}
function earlierOpts(cls, b) {
  const p = picksOf(b);
  return cls.tiers.filter(t => t.lv < 12).flatMap(t => optsFor(cls, t).filter(o => o.id !== p[t.lv]).map(o => ({ ...o, from: t.lv })));
}
function findOpt(cls, id) {
  for (const t of cls.tiers) { const o = optsFor(cls, t).find(o => o.id === id); if (o) return o; }
}

/* ---------- Render ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");
let delArm = false;

function status(b, t) {
  const p = picksOf(b)[t.lv];
  if (b.level >= t.lv) return p ? "picked" : "due";
  return p ? "planned" : "open";
}
const STATUS_TEXT = { picked: "Taken", due: "Pick now", planned: "Planned", open: "Not planned" };

function optRow(o, selected, lv) {
  const tags = [
    typeof o.cost === "number" ? `<span class="vp" title="${o.cost} Valor Point${o.cost > 1 ? "s" : ""}">${`<img src="${ICONS[VALOR_IC]}" alt="">`.repeat(o.cost)}</span>`
      : o.cost ? `<span class="tag">${esc(o.cost)}</span>` : "",
    o.armor ? `<span class="tag">${esc(o.armor)} armor</span>` : "",
    o.hidden ? `<span class="tag hidden">hidden</span>` : "",
    o.from ? `<span class="tag">from Lv ${o.from}</span>` : "",
    o.custom ? `<span class="tag">yours</span>` : "",
  ].join("");
  const desc = [
    `<span>${o.skill ? `<em>${esc(o.skill)}</em>${o.note ? ` (${esc(o.note.toLowerCase())})` : ""}: ` : ""}${esc(o.desc)}</span>`,
    o.up ? `<span class="up"><img src="${ICONS[UP_IC]}" alt="Upgraded:"><span>${esc(o.up)}</span></span>` : "",
    o.info ? `<span class="info">${esc(o.info)}</span>` : "",
    o.hidden ? `<span class="where">Unlocked at ${esc(o.hidden)}.</span>` : "",
  ].filter(Boolean).join("");
  return `<button type="button" class="opt" role="radio" aria-checked="${selected}" data-pick="${lv}" data-id="${esc(o.id)}">
    ${o.ic != null ? `<span class="ico"><img src="${ICONS[o.ic]}" alt="" loading="lazy"></span>` : `<span class="ico blank" aria-hidden="true">?</span>`}
    <span><span class="opt-name"><b>${esc(o.name)}</b> ${tags}</span>${desc ? `<span class="opt-desc">${desc}</span>` : ""}</span></button>`;
}

function render() {
  const b = cur(), cls = byId[b.cls], p = picksOf(b);
  // roster
  const sel = document.getElementById("buildSel");
  sel.innerHTML = S.builds.map(x => `<option value="${x.id}"${x.id === b.id ? " selected" : ""}>${esc(x.name || "Unnamed")} · ${byId[x.cls].name}</option>`).join("");

  const specTier = cls.tiers.find(t => t.kind === "spec");
  const specOpt = specTier && findOpt(cls, p[specTier.lv]);
  const masterOpt = b.level >= 15 && findOpt(cls, p[15]);
  const due = cls.tiers.filter(t => status(b, t) === "due");
  const upcoming = cls.tiers.find(t => t.lv > b.level);
  let next = due.length
    ? `<strong>${due.length === 1 ? "1 pick" : due.length + " picks"} waiting:</strong> Lv ${due.map(t => t.lv).join(", ")}`
    : upcoming ? `Next milestone: <b>Lv ${upcoming.lv}</b> · ${T[upcoming.kind].label}` : "All milestones reached.";
  if (!due.length && upcoming && p[upcoming.lv]) next += ` → ${esc(findOpt(cls, p[upcoming.lv])?.name || "")}`;

  const maxLv = 15, firstLv = cls.tiers[0].lv;
  const pct = Math.max(0, Math.min(1, (b.level - firstLv) / (maxLv - firstLv)));

  app.innerHTML = `
  <section class="sheet" aria-label="Build">
    <div class="namerow">
      <span class="crest" aria-hidden="true"><img src="${ICONS[cls.ic]}" alt=""></span>
      <input id="nameIn" class="name" value="${esc(b.name)}" aria-label="Build name" placeholder="Name this mercenary">
    </div>
    <div class="title-line">Class title: <b>${esc(masterOpt?.name || specOpt?.name || cls.name)}</b>${specOpt || masterOpt ? ` <span>(${cls.name})</span>` : ""}</div>
    <div class="classes" role="group" aria-label="Class">
      ${CLASSES.map(c => `<button type="button" class="cls" data-cls="${c.id}" aria-pressed="${c.id === b.cls}"><img src="${ICONS[c.ic]}" alt=""><b>${c.name}</b><span>${esc(c.weapon)}</span></button>`).join("")}
    </div>
    <p class="blurb">${esc(cls.blurb)}</p>
    <dl class="facts">
      <div><dt>Role</dt><dd>${esc(cls.role)}</dd></div>
      <div><dt>Main stat</dt><dd>${esc(cls.stat)}</dd></div>
      <div><dt>Armor</dt><dd>${esc(cls.armor)}</dd></div>
      <div><dt>From</dt><dd>${esc(cls.source)}</dd></div>
      <div class="wide"><dt>Starting skills</dt><dd>${cls.start.map(esc).join(", ")}</dd></div>
    </dl>
    <div class="levelrow">
      <div class="stepper" role="group" aria-label="Current level">
        <button type="button" id="lvDown" aria-label="Level down">−</button>
        <output id="lvOut" aria-live="polite"><small>LEVEL</small>${b.level}</output>
        <button type="button" id="lvUp" aria-label="Level up">+</button>
      </div>
      <div class="next">${next}</div>
    </div>
    <div class="rail" aria-label="Milestones">
      <span class="fill" style="width: calc((100% - 32px) * ${pct.toFixed(3)})"></span>
      ${cls.tiers.map(t => { const s = status(b, t); return `<button type="button" class="node ${s}${b.level >= t.lv ? " reached" : ""}" data-jump="${t.lv}" aria-label="Level ${t.lv}, ${STATUS_TEXT[s]}"><i><span>${t.lv}</span></i><small>${T[t.kind].short}</small></button>`; }).join("")}
    </div>
  </section>

  ${cls.tiers.map(t => {
    const s = status(b, t), opts = optsFor(cls, t), chosen = p[t.lv];
    let list = opts.map(o => optRow(o, o.id === chosen, t.lv)).join("");
    if (t.kind === "legacy") {
      const prev = earlierOpts(cls, b);
      list += prev.length ? `<div class="subhead">Class Specialisation: options you skipped earlier</div>` + prev.map(o => optRow(o, o.id === chosen, t.lv)).join("") : "";
    }
    if (!list) list = `<div class="empty">No options recorded for this tier yet. Add the ones you see on the level-up screen.</div>`;
    return `<section class="tier ${s}" id="tier-${t.lv}">
      <div class="tier-h"><span class="lv"><span><small>LV</small>${t.lv}</span></span><span class="kind">${T[t.kind].label}</span><span class="pill ${s}">${STATUS_TEXT[s]}</span></div>
      ${T[t.kind].note ? `<p class="tier-note">${T[t.kind].note}</p>` : ""}
      <div class="opts" role="radiogroup" aria-label="Level ${t.lv} options">${list}</div>
      <details class="add"><summary>+ Add a missing option for Lv ${t.lv}</summary>
        <form class="addform" data-add="${t.lv}">
          <input name="n" id="add-n-${t.lv}" placeholder="Name, e.g. Bloodlust" required aria-label="Option name">
          <input name="c" id="add-c-${t.lv}" placeholder="Cost (optional), e.g. 1 VP" aria-label="Cost">
          <textarea name="d" id="add-d-${t.lv}" rows="2" placeholder="What it does" aria-label="Description"></textarea>
          <div class="row"><button class="btn primary small" type="submit">Add to ${cls.name}</button>
          ${(S.custom[cls.id]?.[t.lv] || []).length ? `<button class="btn small danger" type="button" data-clearcustom="${t.lv}">Remove my added options</button>` : ""}</div>
        </form>
      </details>
    </section>`;
  }).join("")}

  <section class="sheet panel">
    <h2>Notes</h2>
    <textarea class="box" id="notesIn" placeholder="Gear, attributes to raise, profession, party role…">${esc(b.notes)}</textarea>
  </section>

  <section class="sheet panel">
    <h2>Back up &amp; share</h2>
    <p>Builds are saved on this device only. Copy the code to keep a backup or send a build to a friend, and paste a code to load it.</p>
    <div class="row">
      <button class="btn small" type="button" id="copyOne">Copy this build</button>
      <button class="btn small" type="button" id="copyAll">Copy everything</button>
    </div>
    <textarea class="box code" id="codeBox" placeholder="Paste a build code here, then tap Load" aria-label="Build code"></textarea>
    <div class="row">
      <button class="btn small primary" type="button" id="loadCode">Load code</button>
      <button class="btn small danger" type="button" id="delBtn">${delArm ? "Tap again to delete" : "Delete this build"}</button>
    </div>
    <div class="status" id="msg" role="status"></div>
  </section>

  <p class="foot">Skill text comes from the Wartales Fandom wiki, and specializations and arena unlocks from game.wiki (October 2026). Patches can change numbers, so trust the in-game level-up screen if they differ. Wartales is a game by Shiro Games; this is a fan-made planner.</p>`;
}

/* ---------- Events ---------- */
function say(t, err) { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = "status" + (err ? " err" : ""); } }
function copy(text) {
  const box = document.getElementById("codeBox");
  box.value = text;
  const fallback = () => { box.select(); say("Code is in the box below. Select it and copy."); };
  try { navigator.clipboard.writeText(text).then(() => say("Copied. Paste it anywhere to keep it."), fallback); } catch { fallback(); }
}

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const b = cur();
  if (t.dataset.cls) { b.cls = t.dataset.cls; delArm = false; save(); render(); return; }
  if (t.dataset.pick) {
    const p = picksOf(b), lv = t.dataset.pick;
    p[lv] = p[lv] === t.dataset.id ? undefined : t.dataset.id;
    if (!p[lv]) delete p[lv];
    save(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.jump) { document.getElementById("tier-" + t.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  if (t.dataset.clearcustom) { const c = S.custom[b.cls]; if (c) { delete c[t.dataset.clearcustom]; } save(); render(); return; }
  switch (t.id) {
    case "lvUp": b.level = Math.min(20, b.level + 1); break;
    case "lvDown": b.level = Math.max(1, b.level - 1); break;
    case "copyOne": copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify({ build: b, custom: { [b.cls]: S.custom[b.cls] || {} } }))))); return;
    case "copyAll": copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S))))); return;
    case "loadCode": return loadCode();
    case "delBtn":
      if (!delArm) { delArm = true; render(); return; }
      delArm = false;
      S.builds = S.builds.filter(x => x.id !== b.id);
      if (!S.builds.length) S.builds.push(newBuild());
      S.active = S.builds[0].id; break;
    default: return;
  }
  save(); const y = window.scrollY; render(); window.scrollTo(0, y);
});

app.addEventListener("input", e => {
  const b = cur();
  if (e.target.id === "nameIn") { b.name = e.target.value; save();
    const o = document.querySelector(`#buildSel option[value="${b.id}"]`); if (o) o.textContent = `${b.name || "Unnamed"} · ${byId[b.cls].name}`; }
  if (e.target.id === "notesIn") { b.notes = e.target.value; save(); }
});

app.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, lv = f.dataset.add, b = cur();
  const name = f.n.value.trim(); if (!name) return;
  const c = (S.custom[b.cls] ||= {}); (c[lv] ||= []).push({ id: "u-" + uid(), name, cost: f.c.value.trim() || undefined, desc: f.d.value.trim() });
  save(); render();
  document.querySelector(`#tier-${lv} details`)?.setAttribute("open", "");
});

function loadCode() {
  const raw = document.getElementById("codeBox").value.trim().replace(/^WTB1:/, "");
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (data.builds) { S = data; say("Loaded " + data.builds.length + " builds."); }
    else if (data.build && byId[data.build.cls]) {
      const nb = { ...data.build, id: uid() }; S.builds.push(nb); S.active = nb.id;
      for (const [cid, tiers] of Object.entries(data.custom || {})) for (const [lv, list] of Object.entries(tiers || {})) {
        const dst = ((S.custom[cid] ||= {})[lv] ||= []);
        for (const o of list) if (!dst.some(x => x.id === o.id)) dst.push(o);
      }
    } else throw 0;
    save(); render(); say("Build loaded.");
  } catch { say("That code didn't load. Paste the whole code, starting with WTB1:", true); }
}

function newBuild() { return { id: uid(), name: "New mercenary", cls: cur()?.cls || "warrior", level: 1, notes: "", picks: {} }; }
document.getElementById("newBtn").addEventListener("click", () => { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; delArm = false; save(); render(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); });
document.getElementById("buildSel").addEventListener("change", e => { S.active = e.target.value; delArm = false; save(); render(); window.scrollTo(0, 0); });

render();
</script>
