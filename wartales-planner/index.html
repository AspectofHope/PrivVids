<style>
/* Layout: one narrow campaign-ledger column; a sticky roster bar, a level rail, then one card per milestone tier. */
:root {
  --bg: #e7e4dc;        /* weathered vellum, slightly green-grey */
  --surface: #f3f1ec;
  --sunk: #dad6cc;
  --ink: #23261f;
  --muted: #5e6157;
  --line: #c4bfb2;
  --brass: #8a5d12;     /* accent: tarnished brass */
  --brass-soft: #ecdcb8;
  --blood: #9b2c22;     /* "due now" */
  --moss: #3f6b3a;      /* "picked" */
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --label: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15180f; --surface: #1f231a; --sunk: #2a2f23; --ink: #e6e2d6; --muted: #a3a593;
    --line: #3a3f31; --brass: #d9a64a; --brass-soft: #3b3020; --blood: #e0735f; --moss: #8cbf7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15180f; --surface: #1f231a; --sunk: #2a2f23; --ink: #e6e2d6; --muted: #a3a593;
  --line: #3a3f31; --brass: #d9a64a; --brass-soft: #3b3020; --blood: #e0735f; --moss: #8cbf7c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.brand { font-family: var(--display); font-size: 1.25rem; line-height: 1; white-space: nowrap; margin-right: auto; }
.brand small { display: block; font-family: var(--label); font-size: .68rem; letter-spacing: .08em; color: var(--muted); margin-top: 3px; }
.bar select { min-width: 0; max-width: 46vw; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }

main { max-width: 640px; margin: 0 auto; padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; font-family: var(--label); font-weight: 700; letter-spacing: .03em; }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--surface); }
.btn.danger { color: var(--blood); }
.btn.small { padding: 4px 9px; font-size: .85rem; }

.eyebrow { font-family: var(--label); font-weight: 700; font-size: .78rem; letter-spacing: .1em; color: var(--muted); text-transform: lowercase; }

/* Build header */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.namerow { display: flex; gap: 8px; align-items: center; }
.name { flex: 1; min-width: 0; font-family: var(--display); font-size: 1.6rem; border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 2px 0; }
.title-line { color: var(--muted); font-size: .95rem; }
.title-line b { color: var(--brass); font-weight: 700; }
.classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.cls { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 6px; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.cls b { font-family: var(--label); font-size: .92rem; overflow-wrap: anywhere; }
.cls span { font-size: .74rem; color: var(--muted); line-height: 1.2; }
.cls[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); box-shadow: inset 0 0 0 1px var(--brass); }
.blurb { font-size: .92rem; color: var(--muted); margin: 0; }

.levelrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 44px; height: 44px; border: 0; background: var(--bg); font-size: 1.4rem; }
.stepper output { min-width: 64px; text-align: center; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.next { font-size: .95rem; flex: 1; min-width: 160px; }
.next strong { color: var(--blood); }

/* Rail of milestone levels */
.rail { position: relative; display: flex; justify-content: space-between; padding: 6px 2px 0; }
.rail::before { content: ""; position: absolute; left: 16px; right: 16px; top: 22px; height: 2px; background: var(--line); }
.rail .fill { position: absolute; left: 16px; top: 22px; height: 2px; background: var(--brass); }
.node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; width: 34px; }
.node i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--label); font-weight: 700; font-size: .9rem;
  border: 2px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.node small { font-size: .62rem; color: var(--muted); white-space: nowrap; }
.node.picked i { border-color: var(--moss); background: var(--moss); color: var(--surface); }
.node.due i { border-color: var(--blood); color: var(--blood); }
.node.reached:not(.picked):not(.due) i { border-color: var(--brass); }

/* Tier cards */
.tier { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; scroll-margin-top: 80px; }
.tier.due { border-color: var(--blood); }
.tier-h { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px 8px; flex-wrap: wrap; }
.lv { font-family: var(--display); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kind { font-family: var(--label); font-weight: 700; letter-spacing: .03em; flex: 1; min-width: 0; }
.pill { font-family: var(--label); font-weight: 700; font-size: .74rem; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.picked { color: var(--moss); } .pill.due { color: var(--blood); } .pill.planned { color: var(--brass); } .pill.open { color: var(--muted); }
.tier-note { padding: 0 14px 8px; margin: 0; font-size: .86rem; color: var(--muted); }
.opts { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 11px 14px; }
.opt:last-child { border-bottom: 0; }
.opt .mark { width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--line); }
.opt[aria-checked="true"] { background: var(--brass-soft); }
.opt[aria-checked="true"] .mark { border-color: var(--brass); background: radial-gradient(circle, var(--brass) 45%, transparent 50%); }
.opt-name { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.tag { font-family: var(--label); font-size: .72rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.tag.vp { color: var(--brass); border-color: var(--brass); }
.tag.hidden { color: var(--blood); border-color: var(--blood); }
.opt-desc { font-size: .9rem; color: var(--muted); margin-top: 2px; }
.opt-desc { display: flex; flex-direction: column; gap: 3px; }
.opt-desc em { color: var(--ink); font-style: italic; }
.opt-desc .up { color: var(--ink); opacity: .85; font-size: .86rem; }
.opt-desc .info { font-family: var(--label); font-size: .76rem; letter-spacing: .04em; }
.opt-desc .where { color: var(--blood); font-size: .86rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 14px; margin: 0; }
.facts div { min-width: 0; }
.facts .wide { grid-column: 1 / -1; }
.facts dt { font-family: var(--label); font-weight: 700; font-size: .72rem; letter-spacing: .08em; color: var(--muted); text-transform: lowercase; }
.facts dd { margin: 0; font-size: .92rem; }
.empty { padding: 12px 14px; font-size: .9rem; color: var(--muted); border-top: 1px solid var(--line); }
.subhead { padding: 8px 14px 4px; font-family: var(--label); font-weight: 700; font-size: .8rem; color: var(--muted); background: var(--sunk); letter-spacing: .05em; }

details.add { border-top: 1px solid var(--line); }
details.add summary { padding: 10px 14px; font-family: var(--label); font-weight: 700; color: var(--brass); cursor: pointer; font-size: .9rem; }
.addform { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
.addform input, .addform textarea, textarea.box { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 8px 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.panel p { margin: 0; font-size: .92rem; color: var(--muted); }
textarea.box { min-height: 96px; resize: vertical; }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; min-height: 80px; }
.status { font-size: .88rem; color: var(--moss); min-height: 1.2em; }
.status.err { color: var(--blood); }
.foot { font-size: .82rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .tier, .opt { transition: background-color .15s, border-color .15s; } }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand">Wartales<small>build planner</small></div>

</div></header>

const CLASSES = [{"id":"warrior","name":"Warrior","role":"Frontline melee, DPS and tank","weapon":"Axes","stat":"Strength","armor":"Heavy or Medium (by specialization)","source":"Base Game","start":["First Aid","Taunt","Wrath"],"blurb":"The Warrior is an aggressive frontline class in Wartales, wielding axes for powerful melee attacks. Warriors combine strong damage output with respectable durability, with specializations ranging from berserker DPS to defensive sentinel builds.","meleeFirst":true,"tiers":[{"lv":2,"opts":[{"id":"warrior-berserker","name":"Berserker","desc":"Deals 3 times more 30-45% strength damage to the target. Critical Hit: Gains Fury.","cost":1,"up":"Deals 30-45% strength damage 3 time(s) to the target and ignores Guard. Critical Hit: Gains Fury.","info":"Melee","skill":"Rampage","armor":"Medium"},{"id":"warrior-executioner","name":"Executioner","desc":"Deals 35% strength damage to all the units in the target area. Attacks 1 time(s) for each unit in the target area.","cost":2,"up":"Deals 35% strength damage to all the units in the target area. Attacks 1 time(s) for each unit in the target area. Fatal Blow: Attacks again.","info":"2m area (circle around this unit)","skill":"Cutting Maelstrom","armor":"Medium"},{"id":"warrior-sentinel","name":"Sentinel","desc":"The unit and all allies in the area gain Riposte.","cost":1,"up":"The unit and all allies in the area gain Riposte and Inspiration for 1 round.","info":"12 area (circle around this unit)","skill":"Ovation","armor":"Heavy"},{"id":"warrior-barbarian","name":"Barbarian","desc":"Deals 50-70% strength damage to the target. The damage is doubled if the target's Health is higher.","cost":1,"up":"Deals 50-70% strength damage to the target. The damage is tripled if the target's Health is higher.","info":"Melee","skill":"Overbearing Strike","armor":"Medium","hidden":"Hoevendorp Arena in Grinmeer Province"}]},{"lv":3,"opts":[{"id":"warrior-defensive-stance","name":"Defensive stance","desc":"Each time the unit takes damage from a skill, you gain 1 VP.","info":"Passive"},{"id":"warrior-valorous-chain","name":"Valorous Chain","desc":"Every time an attack hits multiple units, you gain 1 VP.","info":"Passive"},{"id":"warrior-valorous-duel","name":"Valorous Duel","desc":"Every time this unit engages in combat, you gain 1 VP.","info":"Passive"}]},{"lv":5,"opts":[{"id":"warrior-madness","name":"Madness","desc":"Damage increased by 50% against units with 50% Health or less.","up":"Damage increased by 50% against units with 75% Health or less.","info":"Passive"},{"id":"warrior-recklessness","name":"Recklessness","desc":"The first attack of each fight deals 100% extra damage.","up":"The first attack of each fight deals 150% extra damage.","info":"Passive"},{"id":"warrior-fanaticism","name":"Fanaticism","desc":"At the end of their turn, this unit loses 10% of their maximum Health to gain Fury.","up":"At the end of their turn, this unit loses 10% of their maximum Health to gain Fury and 2 Rage.","info":"Passive"},{"id":"warrior-first-blood","name":"First Blood","desc":"Damage increased by 35% against enemy units with full Health.","up":"Damage increased by 35% against units with full Health. Also applies Fragility for 2 rounds.","info":"Passive"},{"id":"warrior-expose-wounds","name":"Expose Wounds","desc":"The first time this unit lands a critical hit each round, applies Exposed to the target.","up":"Critical Hit increased by 10%. The first time this unit lands a critical hit each round, applies Exposed to the target.","info":"Passive"}]},{"lv":8,"opts":[{"id":"warrior-battle-cry","name":"Battle Cry","desc":"The unit and all allies in the area gain Brutality for 2 rounds.","cost":1,"up":"The unit and all allies in the area gain Brutality for 3 rounds and 2 Rage.","info":"12m area (circle around this unit)"},{"id":"warrior-challenging-shout","name":"Challenging Shout","desc":"Draws all enemies in the area into melee range. Applies Weakening for 1 rounds to enemies disengaged by this.","cost":1,"up":"Draws all enemies in the area into melee range and applies Weakening for 1 rounds.","info":"4m area (circle around this unit)"},{"id":"warrior-ecstasy","name":"Ecstasy","desc":"As long as this unit has less than 50% Health, they always deal critical hits.","up":"As long as this unit has less than 80% Health, they always deal critical hits.","info":"Passive"},{"id":"warrior-limit-break","name":"Limit Break","desc":"Critical Hit increased by 25%.","up":"Critical Hit increased by 50%.","info":"Passive"},{"id":"warrior-bloody-pursuit","name":"Bloody Pursuit","desc":"The first time this unit loses Health each round, deals 40% strength damage to an adjacent enemy.","up":"The first time this unit loses Health each round, deals 60% strength damage to an adjacent enemy.","info":"Passive"}]},{"lv":10,"opts":[{"id":"warrior-second-weapon","name":"Second Weapon","desc":"Can equip a second axe and swap weapons in combat.","info":"Instant"},{"id":"warrior-alacrity","name":"Alacrity","desc":"The unit has a 25% chance to dodge ranged, AoE and melee attacks.","info":"Passive"},{"id":"warrior-lone-wolf","name":"Lone Wolf","desc":"As long as there are no allied units within 5 meters, this unit gains the Lone Wolf status.","info":"Passive"}]},{"lv":12,"opts":[{"id":"warrior-daredevil","name":"Daredevil","desc":"The unit gains Frenzy for 3 rounds.","info":"Instant · Bravery"}]},{"lv":15,"opts":[{"id":"warrior-hero","name":"Hero","desc":"Deals 60-90% strength damage to the target with an additional 15% chance of landing a critical hit. Initiative: Applies Disarm for 1 round(s). Applies Weakening to Elites instead.","cost":2,"up":"Deals 60-90% strength damage to the target with an additional 30% chance of landing a critical hit. Initiative: Applies Disarm for 1 round(s). Applies Weakening to Elites instead.","info":"Melee","skill":"Incapacitating Slice","armor":"Medium"}]}]},{"id":"swordsman","name":"Swordsman","role":"Tank, group buffer","weapon":"Swords","stat":"Strength","armor":"Heavy or Medium (by specialization)","source":"Base Game","start":["First Aid","Taunt","Wrath"],"blurb":"The Swordsman is a versatile frontline class in Wartales, capable of tanking damage or dealing it depending on specialization. Swordsmen wield one-handed or two-handed swords and can equip shields for a defensive playstyle.","meleeFirst":true,"tiers":[{"lv":2,"opts":[{"id":"swordsman-protector","name":"Protector","desc":"The unit and all allies in the area gain Protection for 2 rounds.","cost":1,"up":"The unit and all allies in the area gain Protection for 3 rounds.","info":"10m area (circle around this unit)","skill":"Encouragement","armor":"Heavy"},{"id":"swordsman-fighter","name":"Fighter","desc":"Deals 70%-90% strength damage to the target and applies Destabilisation for 2 rounds.","cost":1,"up":"Deals 70%-90% strength damage to the target and applies Destabilisation for 2 rounds. Always lands a critical hit against enemies without Guard.","info":"Melee","skill":"Destabilising Strike","armor":"Heavy"},{"id":"swordsman-swordmaster","name":"Swordmaster","desc":"Deals 70% strength damage to all the units in the area 2 time(s). Usable after 2 attacks. Performed attacks: 0/2 2m (160 degrees cone)","cost":2,"up":"Deals 70% strength damage to all the units in the area 2 time(s). Usable after 1 attacks. Performed attacks: 0/1 2m (160 degrees cone)","skill":"Laceration","armor":"Medium"},{"id":"swordsman-duellist","name":"Duellist","desc":"Deals 70-90% strength damage to the target and gains Riposte.","cost":1,"up":"Deals 70-90% strength damage to the target and gains Riposte. If this unit already has Riposte, the damage is increased by 50%.","info":"Melee","skill":"Final Blow","armor":"Medium","hidden":"Bernna's Arena in Grinmeer Province"}]},{"lv":3,"opts":[{"id":"swordsman-defensive-stance","name":"Defensive stance","desc":"Each time the unit takes damage from a skill, you gain 1 VP.","info":"Passive"},{"id":"swordsman-valorous-chain","name":"Valorous Chain","desc":"Every time an attack hits multiple units, you gain 1 VP.","info":"Passive"},{"id":"swordsman-valorous-duel","name":"Valorous Duel","desc":"Every time this unit engages in combat, you gain 1 VP.","info":"Passive"}]},{"lv":5,"opts":[{"id":"swordsman-bulwark","name":"Bulwark","desc":"Each time this unit engages, they gain Deflection.","up":"Every time this unit engages in combat, they gain Deflection. Every time they disengage, they gain Fury.","info":"Passive"},{"id":"swordsman-counter-attack","name":"Counter-attack","desc":"The first time this unit engages during the turn, they gain Riposte and Fury.","up":"The first time this unit engages during the turn, they gain Riposte and Fury. The first time they disengage during the turn, they gain Inspiration for 1 round.","info":"Passive"},{"id":"swordsman-daring","name":"Daring","desc":"As long as a Bonus is active on this unit, their attacks apply Weakening for 1 round.","up":"As long as a Bonus is active on this unit, their attacks apply Weakening.","info":"Passive"},{"id":"swordsman-duellist-s-instinct","name":"Duellist's Instinct","desc":"As long as this unit is engaged, they have Brutality.","up":"As long as this unit is engaged in combat, they have Brutality and their Critical Damage is increased by 30%.","info":"Passive"},{"id":"swordsman-unwavering-support","name":"Unwavering Support","desc":"When an attack hits an adjacent ally, 50% of the damage is redirected to this unit. If this unit has already played this turn, the damage from this attack is reduced by 30%.","up":"When an attack hits an adjacent ally, 80% of the damage is redirected to this unit. If this unit has already played this turn, the damage from this attack is reduced by 60%.","info":"Passive"}]},{"lv":8,"opts":[{"id":"swordsman-last-stand","name":"Last Stand","desc":"As long as this unit has less than 50% Armor, they have Brutality.","up":"As long as this unit's Armor is damaged, they have Brutality.","info":"Passive"},{"id":"swo for (const c of CLASSES) {

}
const byId = Object.fromEntries(CLASSES.map(c => [c.id, c]));

const KEY = "wartales-planner-v1";
const uid = () => Math.random().toString(36).slice(2, 9);
function sample() {
  return {
    active: "ex1",
    builds: [
      { id: "ex1", name: "Example: Berserker", cls: "warrior", level: 6, notes: "Example build. Rename it or tap + New to start your own.",
        picks: { warrior: { 2: "warrior-berserker", 3: "warrior-valorous-duel", 5: "warrior-recklessness", 8: "warrior-battle-cry" } } },
    ],
    custom: {},
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { S = sample(); }
if (!S.builds?.length) S = sample();
S.custom ||= {};
// Drop builds for unknown classes and picks that no longer match an option (e.g. after a data update).
S.builds = S.builds.filter(b => byId[b.cls]);
if (!S.builds.length) S = sample();
for (const b of S.builds) for (const [cid, p] of Object.entries(b.picks || {})) {
  const c = byId[cid];
  for (const lv of Object.keys(p)) if (!c || !findOpt(c, p[lv])) delete p[lv];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const cur = () => S.builds.find(b => b.id === S.active) || S.builds[0];
const picksOf = b => (b.picks[b.cls] ||= {});

function optsFor(cls, tier) {
  const extra = (S.custom[cls.id] && S.custom[cls.id][tier.lv]) || [];
  return [...tier.opts, ...extra.map(o => ({ ...o, custom: true }))];
}
function earlierOpts(cls, b) {
  const p = picksOf(b);
  return cls.tiers.filter(t => t.lv < 12).flatMap(t => optsFor(cls, t).filter(o => o.id !== p[t.lv]).map(o => ({ ...o, from: t.lv })));
}
function findOpt(cls, id) {
  for (const t of cls.tiers) { const o = optsFor(cls, t).find(o => o.id === id); if (o) return o; }
}

  return `<button type="button" class="opt" role="radio" aria-checked="${selected}" data-pick="${lv}" data-id="${esc(o.id)}">
    <span class="mark" aria-hidden="true"></span>
    <span><span class="opt-name">${esc(o.name)} ${tags}</span>${desc ? `<span class="opt-desc">${desc}</span>` : ""}</span></button>`;
}

function render() {
  const b = cur(), cls = byId[b.cls], p = picksOf(b);
  // roster
  const sel = document.getElementById("buildSel");
  sel.innerHTML = S.builds.map(x => `<option value="${x.id}"${x.id === b.id ? " selected" : ""}>${esc(x.name || "Unnamed")} · ${byId[x.cls].name}</option>`).join("");

  const specTier = cls.tiers.find(t => t.kind === "spec");
  const specOpt = specTier && findOpt(cls, p[specTier.lv]);
  const masterOpt = b.level >= 15 && findOpt(cls, p[15]);
  const due = cls.tiers.filter(t => status(b, t) === "due");
  const upcoming = cls.tiers.find(t => t.lv > b.level);
  let next = due.length
    ? `<strong>${due.length === 1 ? "1 pick" : due.length + " picks"} waiting:</strong> Lv ${due.map(t => t.lv).join(", ")}`
    : upcoming ? `Next milestone: <b>Lv ${upcoming.lv}</b> · ${T[upcoming.kind].label}` : "All milestones reached.";
  if (!due.length && upcoming && p[upcoming.lv]) next += ` → ${esc(findOpt(cls, p[upcoming.lv])?.name || "")}`;

  const maxLv = 15, firstLv = cls.tiers[0].lv;
  const pct = Math.max(0, Math.min(1, (b.level - firstLv) / (maxLv - firstLv)));

  app.innerHTML = `
  <section class="sheet" aria-label="Build">
    <div class="namerow">
      <input id="nameIn" class="name" value="${esc(b.name)}" aria-label="Build name" placeholder="Name this mercenary">
    </div>
    <div class="title-line">Class title: <b>${esc(masterOpt?.name || specOpt?.name || cls.name)}</b>${specOpt || masterOpt ? ` <span>(${cls.name})</span>` : ""}</div>
    <div class="classes" role="group" aria-label="Class">
      ${CLASSES.map(c => `<button type="button" class="cls" data-cls="${c.id}" aria-pressed="${c.id === b.cls}"><b>${c.name}</b><span>${esc(c.weapon)}</span></button>`).join("")}
    </div>
    <p class="blurb">${esc(cls.blurb)}</p>
    <dl class="facts">
      <div><dt>Role</dt><dd>${esc(cls.role)}</dd></div>
      <div><dt>Main stat</dt><dd>${esc(cls.stat)}</dd></div>
      <div><dt>Armor</dt><dd>${esc(cls.armor)}</dd></div>
      <div><dt>From</dt><dd>${esc(cls.source)}</dd></div>
      <div class="wide"><dt>Starting skills</dt><dd>${cls.start.map(esc).join(", ")}</dd></div>
    </dl>
    <div class="levelrow">
      <div class="stepper" role="group" aria-label="Current level">
        <button type="button" id="lvDown" aria-label="Level down">−</button>
        <output id="lvOut" aria-live="polite">${b.level}</output>
        <button type="button" id="lvUp" aria-label="Level up">+</button>
      </div>
      <div class="next">${next}</div>
    </div>
    <div class="rail" aria-label="Milestones">
      <span class="fill" style="width: calc((100% - 32px) * ${pct.toFixed(3)})"></span>
      ${cls.tiers.map(t => { const s = status(b, t); return `<button type="button" class="node ${s}${b.level >= t.lv ? " reached" : ""}" data-jump="${t.lv}" aria-label="Level ${t.lv}, ${STATUS_TEXT[s]}"><i>${t.lv}</i><small>${T[t.kind].short}</small></button>`; }).join("")}
    </div>
  </section>

  ${cls.tiers.map(t => {
    const s = status(b, t), opts = optsFor(cls, t), chosen = p[t.lv];
    let list = opts.map(o => optRow(o, o.id === chosen, t.lv)).join("");
    if (t.kind === "legacy") {
      const prev = earlierOpts(cls, b);
      list += prev.length ? `<div class="subhead">Class Specialisation: options you skipped earlier</div>` + prev.map(o => optRow(o, o.id === chosen, t.lv)).join("") : "";
    }
    if (!list) list = `<div class="empty">No options recorded for this tier yet. Add the ones you see on the level-up screen.</div>`;
    return `<section class="tier ${s}" id="tier-${t.lv}">
      <div class="tier-h"><span class="lv">Lv ${t.lv}</span><span class="kind">${T[t.kind].label}</span><span class="pill ${s}">${STATUS_TEXT[s]}</span></div>
      ${T[t.kind].note ? `<p class="tier-note">${T[t.kind].note}</p>` : ""}
      <div class="opts" role="radiogroup" aria-label="Level ${t.lv} options">${list}</div>
      <details class="add"><summary>+ Add a missing option for Lv ${t.lv}</summary>
        <form class="addform" data-add="${t.lv}">
          <input name="n" id="add-n-${t.lv}" placeholder="Name, e.g. Bloodlust" required aria-label="Option name">
          <input name="c" id="add-c-${t.lv}" placeholder="Cost (optional), e.g. 1 VP" aria-label="Cost">
          <textarea name="d" id="add-d-${t.lv}" rows="2" placeholder="What it does" aria-label="Description"></textarea>
          <div class="row"><button class="btn primary small" type="submit">Add to ${cls.name}</button>
          ${(S.custom[cls.id]?.[t.lv] || []).length ? `<button class="btn small danger" type="button" data-clearcustom="${t.lv}">Remove my added options</button>` : ""}</div>
        </form>
      </details>
    </section>`;
  }).join("")}

  <section class="sheet panel">
    <h2>Notes</h2>
    <textarea class="box" id="notesIn" placeholder="Gear, attributes to raise, profession, party role…">${esc(b.notes)}</textarea>
  </section>

  <section class="sheet panel">
    <h2>Back up &amp; share</h2>
    <p>Builds are saved on this device only. Copy the code to keep a backup or send a build to a friend, and paste a code to load it.</p>
    <div class="row">
      <button class="btn small" type="button" id="copyOne">Copy this build</button>
      <button class="btn small" type="button" id="copyAll">Copy everything</button>
    </div>
    <textarea class="box code" id="codeBox" placeholder="Paste a build code here, then tap Load" aria-label="Build code"></textarea>
    <div class="row">
      <button class="btn small primary" type="button" id="loadCode">Load code</button>
      <button class="btn small danger" type="button" id="delBtn">${delArm ? "Tap again to delete" : "Delete this build"}</button>
    </div>
    <div class="status" id="msg" role="status"></div>
  </section>

  <p class="foot">Skill text comes from the Wartales Fandom wiki, and specializations and arena unlocks from game.wiki (October 2026). Patches can change numbers, so trust the in-game level-up screen if they differ. Wartales is a game by Shiro Games; this is a fan-made planner.</p>`;
}

/* ---------- Events ---------- */
function say(t, err) { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = "status" + (err ? " err" : ""); } }
function copy(text) {
  const box = document.getElementById("codeBox");
  box.value = text;
  const fallback = () => { box.select(); say("Code is in the box below. Select it and copy."); };
  try { navigator.clipboard.writeText(text).then(() => say("Copied. Paste it anywhere to keep it."), fallback); } catch { fallback(); }
}

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const b = cur();
  if (t.dataset.cls) { b.cls = t.dataset.cls; delArm = false; save(); render(); return; }
  if (t.dataset.pick) {
    const p = picksOf(b), lv = t.dataset.pick;
    p[lv] = p[lv] === t.dataset.id ? undefined : t.dataset.id;
    if (!p[lv]) delete p[lv];
    save(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.jump) { document.getElementById("tier-" + t.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  if (t.dataset.clearcustom) { const c = S.custom[b.cls]; if (c) { delete c[t.dataset.clearcustom]; } save(); render(); return; }
  switch (t.id) {
    case "lvUp": b.level = Math.min(20, b.level + 1); break;
    case "lvDown": b.level = Math.max(1, b.level - 1); break;
    case "copyOne": copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify({ build: b, custom: { [b.cls]: S.custom[b.cls] || {} } }))))); return;
    case "copyAll": copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S))))); return;
    case "loadCode": return loadCode();
    case "delBtn":
      if (!delArm) { delArm = true; render(); return; }
      delArm = false;
      S.builds = S.builds.filter(x => x.id !== b.id);
      if (!S.builds.length) S.builds.push(newBuild());
      S.active = S.builds[0].id; break;
    default: return;
  }
  save(); const y = window.scrollY; render(); window.scrollTo(0, y);
});

app.addEventListener("input", e => {
  const b = cur();
  if (e.target.id === "nameIn") { b.name = e.target.value; save();
    const o = document.querySelector(`#buildSel option[value="${b.id}"]`); if (o) o.textContent = `${b.name || "Unnamed"} · ${byId[b.cls].name}`; }
  if (e.target.id === "notesIn") { b.notes = e.target.value; save(); }
});

app.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, lv = f.dataset.add, b = cur();
  const name = f.n.value.trim(); if (!name) return;
  const c = (S.custom[b.cls] ||= {}); (c[lv] ||= []).push({ id: "u-" + uid(), name, cost: f.c.value.trim() || undefined, desc: f.d.value.trim() });
  save(); render();
  document.querySelector(`#tier-${lv} details`)?.setAttribute("open", "");
});

function loadCode() {
  const raw = document.getElementById("codeBox").value.trim().replace(/^WTB1:/, "");
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (data.builds) { S = data; say("Loaded " + data.builds.length + " builds."); }
    else if (data.build && byId[data.build.cls]) {
      const nb = { ...data.build, id: uid() }; S.builds.push(nb); S.active = nb.id;
      for (const [cid, tiers] of Object.entries(data.custom || {})) for (const [lv, list] of Object.entries(tiers || {})) {
        const dst = ((S.custom[cid] ||= {})[lv] ||= []);
        for (const o of list) if (!dst.some(x => x.id === o.id)) dst.push(o);
      }
    } else throw 0;
    save(); render(); say("Build loaded.");
  } catch { say("That code didn't load. Paste the whole code, starting with WTB1:", true); }
}

function newBuild() { return { id: uid(), name: "New mercenary", cls: cur()?.cls || "warrior", level: 1, notes: "", picks: {} }; }
document.getElementById("newBtn").addEventListener("click", () => { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; delArm = false; save(); render(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); });
document.getElementById("buildSel").addEventListener("change", e => { S.active = e.target.value; delArm = false; save(); render(); window.scrollTo(0, 0); });

render();
</script>
