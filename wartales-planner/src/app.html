<title>Wartales Build Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: the in-game character sheet folded into one phone column. Hero card (name, class, level), tab boxes, then the
   specialisation tree as "Lvl" rows of icons, or the equipment paper-doll. Single dark look by design, matching the game. */
:root {
  --bg: #242220;          /* weathered stone */
  --panel: #191816;
  --panel-hi: #211f1c;
  --tab: #141312;
  --line: #48443e;        /* Lvl rules and frames */
  --ink: #e4ded0;
  --muted: #9a9387;
  --dim: #6b665d;
  --gold: #c6a564;        /* accent: selection ring */
  --gold-hi: #ecd59d;
  --green: #8ab55f;
  --red: #cf5a40;
  --r-common: #d8d2c4; --r-unusual: #86b65a; --r-rare: #5f95dc; --r-legendary: #b984e0;
  --serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.4;
  background:
    radial-gradient(140% 90% at 50% 0%, rgba(255,255,255,.035), transparent 55%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--tab); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--tab); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.brand { font-weight: 600; font-size: 1.15rem; line-height: 1; margin-right: auto; white-space: nowrap; letter-spacing: .02em; }
.brand small { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
.bar select { min-width: 0; max-width: 48vw; padding: 6px 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 0; }

main { max-width: 640px; margin: 0 auto; padding-block: 14px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }

/* Panels: flat dark slabs with a hairline frame, as in the game */
.panel { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 6px 18px rgba(0,0,0,.35); }
.btn { border: 1px solid var(--line); background: #2b2926; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--gold); }
.btn.primary { border-color: var(--gold); color: var(--gold-hi); background: #2f2a20; }
.btn.danger { color: var(--red); }
.btn.small { padding: 4px 10px; font-size: .92rem; white-space: nowrap; }

/* Hero: name, class line, level */
.hero { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.hero-top { display: flex; gap: 12px; align-items: flex-start; }
.portrait { width: 64px; height: 64px; flex: none; background: radial-gradient(circle at 50% 40%, #3a3631, #141312 75%); border: 1px solid var(--line); display: grid; place-items: center; }
.portrait img { width: 40px; height: 40px; filter: invert(.86) sepia(.25); }
.who { flex: 1; min-width: 0; }
.name { width: 100%; font-size: 1.7rem; font-weight: 500; line-height: 1.1; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 0 0 2px; }
.name:focus { border-bottom-color: var(--line); outline: none; }
.classline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 1.02rem; margin-top: 2px; flex-wrap: wrap; }
.classline img { width: 20px; height: 20px; filter: invert(.7) sepia(.2); }
.classline b { color: var(--ink); font-weight: 500; }
.levelrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); background: var(--tab); }
.stepper button { width: 42px; height: 40px; border: 0; background: transparent; font-size: 1.3rem; color: var(--gold); }
.stepper output { min-width: 74px; text-align: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stepper output span { color: var(--muted); font-size: .9rem; }
.next { flex: 1; min-width: 170px; font-size: .98rem; color: var(--muted); }
.next b { color: var(--ink); font-weight: 600; }
.next strong { color: var(--red); font-weight: 600; }
.points { display: inline-flex; align-items: center; gap: 4px; color: var(--gold-hi); font-weight: 600; }
.classes { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.cls { aspect-ratio: 1; border: 1px solid var(--line); background: var(--tab); display: grid; place-items: center; padding: 0; }
.cls img { width: 62%; height: 62%; filter: invert(.55) sepia(.2); }
.cls[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 10px rgba(198,165,100,.3); }
.cls[aria-pressed="true"] img { filter: invert(.92) sepia(.5) saturate(1.6); }
.blurb { margin: 0; font-size: .95rem; color: var(--muted); font-style: italic; }

/* Tab boxes like the game's panel titles */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.tab { background: var(--tab); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 9px 2px; font-size: .98rem; font-weight: 500; color: var(--muted); line-height: 1.1; }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -2px 0 var(--gold); }

/* Specialisation tree */
.tree { padding: 6px 12px 14px; }
.lvrow { padding-top: 14px; }
.rule { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 1.02rem; }
.rule::before, .rule::after { content: ""; flex: 1; height: 7px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; }
.rule .st { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.rule .st.due { color: var(--red); } .rule .st.picked { color: var(--green); } .rule .st.planned { color: var(--gold); }
.icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 12px; padding: 12px 0 8px; }
.sk { position: relative; width: 54px; height: 54px; padding: 0; border: 0; background: none; }
.sk > img { width: 54px; height: 54px; display: block; filter: grayscale(1) brightness(.5) contrast(1.1); transition: filter .15s; }
.sk:hover > img { filter: grayscale(.6) brightness(.75); }
.sk.on > img { filter: drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 1.5px var(--gold)) drop-shadow(0 0 1.5px var(--gold)) drop-shadow(0 0 6px rgba(236,213,157,.55)); }
.sk.focus:not(.on) > img { filter: grayscale(.2) brightness(.85); }
.sk .vp { position: absolute; right: -3px; bottom: -3px; display: flex; gap: 0; }
.sk .vp img { width: 15px; height: 15px; filter: none; }
.sk.small, .sk.small > img { width: 46px; height: 46px; }
.detail { margin: 2px 2px 0; padding: 10px 12px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.05); }
.detail .hint { color: var(--dim); font-style: italic; font-size: .95rem; margin: 0; text-align: center; }
.d-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.d-h b { font-size: 1.15rem; font-weight: 600; }
.d-h .sub { color: var(--muted); font-style: italic; }
.cost { display: inline-flex; gap: 1px; vertical-align: middle; }
.cost img { width: 17px; height: 17px; }
.tag { font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; }
.tag.hidden { color: var(--red); border-color: var(--red); }
.desc { margin: 6px 0 0; font-size: .98rem; color: #d3ccbd; }
.up { display: flex; gap: 6px; margin-top: 6px; font-size: .94rem; color: var(--muted); }
.up img { width: 15px; height: 15px; margin-top: 3px; flex: none; }
.info { margin-top: 6px; font-size: .8rem; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.where { margin-top: 6px; color: var(--red); font-size: .94rem; }
.d-act { display: flex; justify-content: flex-end; margin-top: 8px; gap: 8px; }
.subpick { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.subpick > p.lead { margin: 0; color: var(--muted); font-size: .92rem; text-align: center; }

.term { border-bottom: 1px dotted var(--gold); cursor: help; }

/* Equipment */
.equip { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.h2 { margin: 0; text-align: center; font-weight: 500; font-size: 1.1rem; background: var(--tab); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 6px; }
.style { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.style button { border: 1px solid var(--line); background: var(--tab); padding: 8px 6px; line-height: 1.15; }
.style button small { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
.style button[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.style .rec { color: var(--gold-hi); }
.why { margin: 0; font-size: .92rem; color: var(--muted); font-style: italic; text-align: center; }
.doll { display: grid; grid-template-columns: repeat(3, 84px); grid-template-areas: ". helmet ." "weapon armour offhand" "belt . backpack"; justify-content: center; gap: 10px 14px; }
.slot { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; }
.slot .box { width: 72px; height: 72px; background: radial-gradient(circle, #2b2825, #161513); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 0 14px rgba(0,0,0,.7); display: grid; place-items: center; position: relative; }
.slot .box img { width: 62px; height: 62px; object-fit: contain; }
.slot.tall .box { height: 116px; }
.slot.tall .box img { height: 106px; }
.slot .box .ph { width: 30px; height: 30px; opacity: .25; filter: invert(1); }
.slot .box.r-Common { box-shadow: inset 0 0 0 1px var(--r-common), inset 0 0 14px rgba(0,0,0,.6); }
.slot .box.r-Unusual { box-shadow: inset 0 0 0 1px var(--r-unusual), inset 0 0 14px rgba(0,0,0,.6); }
.slot .box.r-Rare { box-shadow: inset 0 0 0 1px var(--r-rare), inset 0 0 14px rgba(0,0,0,.6); }
.slot .box.r-Legendary { box-shadow: inset 0 0 0 1px var(--r-legendary), inset 0 0 14px rgba(0,0,0,.6); }
.slot small { font-size: .8rem; color: var(--muted); }
.slot[disabled] { opacity: .35; cursor: not-allowed; }
.gearlist { display: flex; flex-direction: column; }
.gi { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 9px 2px; border-top: 1px solid rgba(255,255,255,.06); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.gi img.ii { width: 48px; height: 64px; object-fit: contain; }
.gi .n { font-weight: 600; font-size: 1.02rem; }
.n.r-Common { color: var(--r-common); } .n.r-Unusual { color: var(--r-unusual); } .n.r-Rare { color: var(--r-rare); } .n.r-Legendary { color: var(--r-legendary); }
.meta { font-size: .86rem; color: var(--muted); }
.stats { font-size: .9rem; color: #cfc8b8; }
.stats .ex { color: var(--muted); font-style: italic; }
.fx { font-size: .92rem; color: #cfc8b8; margin-top: 2px; }
.fx i { color: var(--gold); font-style: normal; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: .76rem; letter-spacing: .03em; color: var(--gold-hi); border: 1px solid rgba(198,165,100,.5); padding: 0 6px; }
.chip.rec { background: rgba(198,165,100,.16); }
.plan { display: flex; flex-direction: column; }
.plan-row { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(0, 1fr)); gap: 6px; align-items: start; padding: 8px 4px; border-top: 1px solid rgba(255,255,255,.06); }
.plan-row.head { border-top: 0; padding-block: 0 4px; color: var(--muted); font-size: .82rem; }
.plan-row.now { background: rgba(198,165,100,.09); box-shadow: inset 2px 0 0 var(--gold); }
.plan-row .lvl { font-size: .9rem; line-height: 1.15; }
.plan-row.now .lvl { color: var(--gold-hi); }
.pc { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; text-align: center; min-width: 0; width: 100%; }
.pc img { width: 40px; height: 54px; object-fit: contain; }
.pc span { font-size: .74rem; line-height: 1.1; color: #cfc8b8; overflow-wrap: anywhere; }
.note { margin: 0; font-size: .86rem; color: var(--dim); font-style: italic; }

/* Stats & job tab */
.stats-tab { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.focus { margin: 0; text-align: center; font-size: 1.05rem; }
.focus b { color: var(--gold-hi); font-weight: 600; }
.prio { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.prio li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.prio .num { width: 26px; height: 26px; transform: rotate(45deg); border: 1px solid var(--line); display: grid; place-items: center; margin-top: 3px; background: var(--tab); }
.prio .num span { transform: rotate(-45deg); font-size: .85rem; font-variant-numeric: tabular-nums; }
.prio .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prio .top b { font-size: 1.08rem; font-weight: 600; }
.lvl-chip { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; border: 1px solid currentColor; }
.lvl-chip.High { color: var(--gold-hi); } .lvl-chip.Medium { color: var(--muted); } .lvl-chip.Low { color: var(--dim); }
.prio p { margin: 3px 0 0; font-size: .95rem; color: #cfc8b8; }
.prio .tgt { color: var(--green); font-size: .9rem; margin-top: 3px; }
.growth { display: flex; flex-direction: column; gap: 5px; }
.gr { display: grid; grid-template-columns: 96px 1fr 40px; gap: 8px; align-items: center; font-size: .92rem; }
.gr .bar { height: 8px; background: rgba(255,255,255,.06); }
.gr .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8a7448, var(--gold)); }
.gr .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.job { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 9px 2px; border: 0; border-top: 1px solid rgba(255,255,255,.06); background: none; text-align: left; width: 100%; }
.job img { width: 48px; height: 48px; }
.job.on { background: rgba(198,165,100,.1); box-shadow: inset 3px 0 0 var(--gold); }
.job .n { font-weight: 600; font-size: 1.05rem; }
.job .mb { color: var(--green); font-size: .92rem; }
.ranks { font-size: .8rem; color: var(--dim); margin-top: 2px; }

/* Party and camp */
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #000; background: var(--tab); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.modes button { border: 0; background: none; padding: 9px 2px; font-size: .96rem; color: var(--muted); letter-spacing: .02em; }
.modes button[aria-selected="true"] { color: var(--gold-hi); box-shadow: inset 0 -2px 0 var(--gold); background: rgba(198,165,100,.07); }
.members { display: flex; flex-direction: column; }
.member { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px 2px; border: 0; border-top: 1px solid rgba(255,255,255,.06); background: none; text-align: left; width: 100%; }
.portrait.sm { width: 44px; height: 44px; }
.portrait.sm img { width: 28px; height: 28px; }
.mi .n { font-weight: 600; font-size: 1.05rem; }
.mi .meta { display: block; }
.roles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.rl { display: flex; flex-direction: column; align-items: center; background: var(--tab); border: 1px solid var(--line); padding: 5px 2px; }
.rl b { font-size: 1.25rem; font-weight: 600; color: var(--gold-hi); line-height: 1.1; font-variant-numeric: tabular-nums; }
.rl span { font-size: .7rem; color: var(--muted); letter-spacing: .02em; }
.rl.zero b { color: var(--dim); }
.pro { color: var(--green); font-size: .94rem; margin: 2px 0 0; }
.con { color: var(--red); font-size: .94rem; margin: 2px 0 0; }
.lead { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.jobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.jc { display: grid; grid-template-columns: 32px 1fr; gap: 6px; align-items: center; background: var(--tab); border: 1px solid var(--line); padding: 4px 6px; }
.jc img { width: 32px; height: 32px; }
.jc b { font-weight: 600; font-size: .95rem; display: block; line-height: 1.1; }
.jc .meta { display: block; font-size: .8rem; line-height: 1.15; }
.jc.zero { opacity: .55; }
.structs { display: flex; flex-direction: column; }
.st-row { padding: 9px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.st-row.off { opacity: .55; }
.st-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-h b { font-weight: 600; font-size: 1.04rem; }
.sti { width: 22px; height: 22px; }
.own { width: 24px; height: 24px; border: 1px solid var(--line); background: var(--tab); color: var(--gold-hi); padding: 0; font-size: .9rem; line-height: 1; }
.own[aria-pressed="true"] { border-color: var(--gold); }
.tiers { margin-left: auto; display: inline-flex; gap: 3px; }
.tiers button { border: 1px solid var(--line); background: var(--tab); font-size: .8rem; padding: 1px 6px; color: var(--muted); }
.tiers button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); }
.who2 { margin-top: 4px; }
select.as { margin-top: 5px; width: 100%; padding: 5px 8px; border: 1px solid var(--line); background: #11100f; }

/* Crafting */
.how { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.htg b { color: var(--gold-hi); font-weight: 600; }
.ings { display: flex; flex-wrap: wrap; gap: 6px; }
.ing { border: 1px solid var(--line); background: var(--tab); padding: 3px 8px; text-align: left; }
.ing b { color: var(--gold-hi); font-weight: 600; }
.ing small { display: block; font-size: .72rem; color: var(--muted); }
.pin { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.pin img.ii { width: 48px; height: 64px; object-fit: contain; }
.pin .n { font-weight: 600; }
.qty { display: flex; align-items: center; border: 1px solid var(--line); background: var(--tab); }
.qty button { width: 34px; height: 34px; border: 0; background: none; color: var(--gold); font-size: 1.2rem; }
.qty span { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.shop { display: flex; flex-direction: column; }
.sh-row { display: grid; grid-template-columns: minmax(0, 1fr) 46px 64px 46px; gap: 8px; align-items: center; padding: 6px 2px; border-top: 1px solid rgba(255,255,255,.06); font-variant-numeric: tabular-nums; }
.sh-row.head { border-top: 0; color: var(--muted); font-size: .84rem; }
.sh-row > span { text-align: right; }
.sh-row.head > span:first-child { text-align: left; }
.sh-row .ing { width: 100%; }
.sh-row input { width: 100%; padding: 4px 6px; border: 1px solid var(--line); background: #11100f; text-align: right; }
.sh-row .get { color: var(--red); font-weight: 600; }
.sh-row.done .get { color: var(--green); }

/* Item stats, layers, sheet */
.ised { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.igrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.igrid label { display: flex; flex-direction: column; font-size: .78rem; color: var(--muted); gap: 2px; }
.igrid input, .cs input { width: 100%; padding: 4px 6px; border: 1px solid var(--line); background: #11100f; text-align: right; font-variant-numeric: tabular-nums; }
.layers { display: flex; flex-direction: column; gap: 6px; }
.lslot { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--tab); padding: 6px; text-align: left; }
.lslot .box.sq { width: 48px; height: 48px; display: grid; place-items: center; background: radial-gradient(circle, #2b2825, #161513); border: 1px solid #000; }
.lslot .box.sq img { width: 40px; height: 40px; object-fit: contain; }
.lslot b { display: block; font-weight: 600; }
.gi img.ii.lay { height: 48px; }
.cs { display: flex; flex-direction: column; }

  shield: "Shield", throw: "Throwing weapon", melee: "Off-hand weapon", bomb: "Bomb or flask", torch: "Torch",

/* ---------- Inline game icons ---------- */

const RES_RE = /\b(Valou?r Points?|Valou?r|VP|Happiness|food|Food|Knowledge(?: Points?)?|Influence|Krowns)\b/g;
function resIcon(word) {

  const src = /^(valou?r|vp)/.test(w) ? ICONS[VALOR_IC] : w === "happiness" ? SMALL.res.happy : w === "food" ? SMALL.res.food : w.startsWith("knowledge") ? SMALL.res.knowledge : w === "influence" ? SMALL.res.influence : w === "krowns" ? SMALL.res.krowns : "";

/* ---------- State ---------- */
const KEY = "wartales-planner-v1";
const uid = () => Math.random().toString(36).slice(2, 9);
function sample() {
  return {
    active: "ex1", tab: "spec",
    builds: [{ id: "ex1", name: "Example: Berserker", cls: "warrior", level: 6, notes: "Example build. Rename it or tap + New to start your own.",
      picks: { warrior: { 2: "warrior-berserker", 3: "warrior-valorous-duel", 5: "warrior-recklessness", 8: "warrior-battle-cry" } }, gear: {} }],
    custom: {},

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { S = sample(); }
if (!S.builds?.length) S = sample();
S.custom ||= {}; S.tab ||= "spec"; S.mode ||= "char"; S.party ||= {}; S.camp ||= { own: null, assign: {} }; S.camp.own ||= { fire: 1, tent: 1, pot: 1, workshop: 1, gurney: 1, dummy: 1, table: 1 }; S.camp.assign ||= {}; S.shop ||= { list: [], have: {} };

if (!S.builds.length) S = sample();
const ITEM = Object.fromEntries(ITEMS.map(i => [i.n, i]));
for (const b of S.builds) {
  b.gear ||= {}; b.job ||= {};
  for (const [cid, p] of Object.entries(b.picks || {})) {
    const c = byId[cid];
    for (const lv of Object.keys(p)) if (!c || !(p[lv] === "cs" || findOpt(c, p[lv]))) delete p[lv];

}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const cur = () => S.builds.find(b => b.id === S.active) || S.builds[0];
const picksOf = b => (b.picks[b.cls] ||= {});
const gearOf = b => (b.gear[b.cls] ||= {});
function optsFor(cls, tier) {

function findOpt(cls, id) {
  for (const t of cls.tiers) { const o = optsFor(cls, t).find(o => o.id === id); if (o) return o; }
}
function skipped(cls, b) {

function status(b, t) {

const STATUS_TEXT = { picked: "Taken", due: "Pick now", planned: "Planned", open: "" };

/* ---------- Recommendations ---------- */
function profile(cls, b) {

    const text = [o.name, o.skill, o.desc, o.up].join(" ");

  }
  return prof;
}
function armourWeights(cls, b) {
  const p = picksOf(b), spec = cls.tiers.find(t => t.kind === "spec");
  const so = spec && findOpt(cls, p[spec.lv]);

  if (w === "heavy") return { list: ["heavy", "medium", "light"], best: "heavy", from: so.name };
  if (w === "medium") return { list: ["medium", "light"], best: "medium", from: so.name };
  if (w === "light") return { list: ["light"], best: "light", from: so.name };

}
function styleRec(cls, b, prof) {
  const g = GEAR[cls.id];
  if (!(g.one && g.two)) return null;
  const def = (prof["Guard"] || 0) + (prof["Protection"] || 0) + (prof["Riposte"] || 0);
  const aoe = (prof["Area attacks"] || 0) + (prof["Critical hits"] || 0) * 0.5;
  const style = def > aoe ? "one" : "two";

    const style = gear.style || styleRec(cls, b, profile(cls, b))?.style || (g.two ? "two" : "one");

function jobAdvice(cls, b) {

function recruitAdvice(party) {
  const roles = {}; for (const b of party) { const r = roleOf(b); roles[r] = (roles[r] || 0) + 1; }
  const jobs = new Set(party.map(jobOf).filter(Boolean));
  const avgLv = party.reduce((a, b) => a + b.level, 0) / Math.max(1, party.length);
  const shop = shoppingList();
  const R = [], J = [];
  if (!roles.Tank) R.push({ r: "Tank", w: 3, why: "No tank to hold the front line." });
  if ((roles.Tank || 0) + (roles.Melee || 0) < 2) R.push({ r: "Melee", w: 2.4, why: "Fewer than two frontliners." });
  if (!roles.Healer && party.length >= 3) R.push({ r: "Healer", w: 2, why: "No healer beyond First Aid." });
  if (!roles.Ranged && party.length >= 3) R.push({ r: "Ranged", w: 1.6, why: "Nobody attacks from range." });
  if (!roles.Reach && !roles.Support && party.length >= 4) R.push({ r: "Reach", w: 1.2, why: "A Spearman supports from behind the front line." });
  const want = (j, w, why) => { if (!jobs.has(j)) J.push({ j, w, why }); };
  want("Blacksmith", 3, "Nobody can forge gear.");
  want("Tinkerer", 2.6, "Needed for camp tools, the Workshop, Raw Materials and Rope.");
  want("Cook", 2.4, "A Cook at the Cooking Pot saves 2–6 food every day.");
  if (jobs.has("Blacksmith") || shop["Iron Ore"]) want("Miner", 2.3 + (shop["Iron Ore"] ? 0.5 : 0), "Every recipe uses Iron Ore; mining beats buying. Experienced Miners also find Grey Clusters for Rimesteel.");
  if (jobs.has("Blacksmith") || shop["Wood"] || shop["Coal"]) want("Woodcutter", 1.8 + (shop["Wood"] || shop["Coal"] ? 0.4 : 0), "Wood goes into weapons and shields, and into Coal at the Campfire; skilled Woodcutters find Carmine Tanbark for Vairmeil.");
  want("Alchemist", avgLv >= 5 || shop["Rimesteel"] || shop["Akhedian Steel"] || shop["Vairmeil"] ? 2.5 : 1.4, "From Rimesteel tier (level 8) on, every crafted item needs an Alchemist's alloy.");
  want("Scholar", 1.2, "The Lectern earns Knowledge to unlock recipes.");
  if (jobs.has("Cook")) { want("Angler", 0.9, "Fish keeps your Cook supplied."); want("Huntsman", 0.8, "Game from burrows keeps your Cook supplied."); }
  want("Bard", 0.8, "The Lute gives every companion +1 Willpower.");
  R.sort((a, b) => b.w - a.w); J.sort((a, b) => b.w - a.w);
  const ROLE_CLASS = { Tank: [["swordsman", "Protector"], ["warrior", "Sentinel"], ["brute", "Destroyer"]], Melee: [["warrior", ""], ["brute", ""], ["pugilist", ""]], Healer: [["thaumaturge", "Healer"]], Ranged: [["archer", ""], ["crossbowman", ""]], Reach: [["spearman", ""]] };
  const ANY = [["warrior", ""], ["swordsman", ""], ["archer", ""], ["spearman", ""], ["thaumaturge", ""], ["ranger", ""], ["brute", ""], ["crossbowman", ""], ["pugilist", ""]];
  const fit = (cid, j) => { const pf = PROFS.find(p => p.n === j); if (!pf) return 0; const st = byId[cid].stat === "Strength" ? "str" : "dex"; return (pf.m[st] || 0) / 10 + (pf.m.crit || 0) / 24 + ((pf.m.con || 0) && ["swordsman", "warrior", "brute"].includes(cid) ? 0.3 : 0) + ((pf.m.wil || 0) > 0 && FRONTLINE.includes(cid) ? 0.25 : 0); };
  const combos = [];
  const roleOpts = R.length ? R.slice(0, 3) : [{ r: "", w: 0, why: "" }];
  const jobOpts = J.length ? J.slice(0, 4) : [{ j: "", w: 0, why: "" }];
  for (const ro of roleOpts) for (const jo of jobOpts) {
    for (const [cid, spec] of (ROLE_CLASS[ro.r] || ANY)) {
      const f = jo.j ? fit(cid, jo.j) : 0;
      combos.push({ cid, spec, job: jo.j, score: ro.w + jo.w + f * 1.5, why: [ro.why, jo.why].filter(Boolean), f, role: ro.r });
    }
  }
  combos.sort((a, b) => b.score - a.score);
  const picked = [], seen = new Set();
  for (const c of combos) { const k = c.cid + c.job, k2 = c.role + "|" + c.job; if (seen.has(k) || seen.has(k2)) continue; seen.add(k); seen.add(k2); picked.push(c); if (picked.length === 3) break; }
  return { picked, R, J };
}

// Armour layers from the Fandom wiki's Armour Layers page
const LAYERS = __LAYERS__;
const LAYER = Object.fromEntries(LAYERS.map(l => [l.n, l]));
const STAT_KEYS = [["str", "Strength"], ["dex", "Dexterity"], ["con", "Constitution"], ["wil", "Willpower"], ["crit", "Critical Hit", "%"], ["cd", "Critical Damage", "%"], ["mv", "Movement"], ["a", "Armour"], ["g", "Guard"]];
const STAT_BY_NAME = Object.fromEntries(STAT_KEYS.map(([k, n]) => [n.toLowerCase(), k]));
// Read flat bonuses like "+4 Strength", "Critical Hit +5%", "+10% Critical Damage"; percent bonuses to Strength/Dexterity are not flat, so they are skipped
function parseStats(text) {
  const out = {};
  const re = /([+-]\d+)(%?)\s+(Strength|Dexterity|Constitution|Willpower|Critical Hit|Critical Damage|Movement|Armour|Guard)|(Strength|Dexterity|Constitution|Willpower|Critical Hit|Critical Damage|Movement|Armour|Guard)\s+([+-]\d+)(%?)/gi;
  for (const m of String(text || "").replace(/\s*\((?:lvl|level) \d+\)/g, "").matchAll(re)) {
    const v = +(m[1] || m[5]), pct = m[2] || m[6], name = (m[3] || m[4]).toLowerCase(), k = STAT_BY_NAME[name];
    if (pct && (k === "str" || k === "dex")) continue;
    out[k] = (out[k] || 0) + v;
  }
  return out;
}
function defaultItemStats(it) {
  const base = BASE_DEF[it.s === "offhand" ? (it.k === "shield" ? "shield" : "") : it.s + "-" + it.k] || {};
  const v = parseStats(it.st);
  if (base.a) v.a = (v.a || 0) + base.a;
  if (base.g) v.g = (v.g || 0) + base.g;
  if (base.m && !v.mv) v.mv = base.m;
  return v;
}
const istatsOf = b => (b.istats ||= {})[b.cls] ||= {};
const layersOf = b => (b.layers ||= {})[b.cls] ||= [];
function itemStats(b, slot) {
  const it = ITEM[gearOf(b)[slot]]; if (!it) return null;
  const saved = istatsOf(b)[slot];
  return saved && saved.item === it.n ? { vals: saved.vals, mine: true } : { vals: defaultItemStats(it), mine: false };
}
function statEditor(b, slot) {
  const s = itemStats(b, slot); if (!s) return "";
  return `<div class="ised"><div class="htg"><b>Your item's stats</b> <span class="meta">${s.mine ? "entered by you" : "pre-filled from the wiki; change them to match your item"}</span></div>
    <div class="igrid">${STAT_KEYS.map(([k, n, u]) => `<label><span>${n}${u ? " %" : ""}</span><input type="number" inputmode="numeric" data-istat="${slot}" data-k="${k}" value="${s.vals[k] ?? ""}" placeholder="0"></label>`).join("")}</div>
    ${s.mine ? `<div class="d-act"><button type="button" class="btn small" data-ireset="${slot}">Reset to wiki values</button></div>` : ""}</div>`;
}
function layerScore(l, cls, b) {
  const adv = statAdvice(cls, b), lvl = Object.fromEntries(adv.map(a => [a.stat, a.level]));
  const W = { High: 1, Medium: 0.6, Low: 0.15 };
  const tank = (profile(cls, b)["Guard"] || 0) + (profile(cls, b)["Protection"] || 0) > 0 || armourWeights(cls, b).best === "heavy";
  const v = parseStats(l.d), main = cls.stat === "Strength" ? "str" : "dex", other = main === "str" ? "dex" : "str";
  let s = (v[main] || 0) * 1 + (v[other] || 0) * 0.1 + (v.crit || 0) * 0.7 * W[lvl["Critical Hit"]] * 1.4 + (v.cd || 0) * 0.35 * (main === "str" ? 1 : 0.6) * W[lvl["Critical Hit"]] * 1.4
    + (v.mv || 0) * 2 * W[lvl["Movement"]] + (v.a || 0) * (tank ? 0.2 : 0.08) + (v.g || 0) * (tank ? 0.6 : 0.25);
  if (/%/.test(l.d) && /(Strength|Dexterity) \+\d+%/.test(l.d)) s += /Strength/.test(l.d) === (main === "str") ? 4 : 0.5;
  return s;
}
function openLayerPicker(i) {
  const b = cur(), cls = byId[b.cls], have = layersOf(b);
  pkSlot = "layer" + i;
  document.getElementById("pkTitle").textContent = `Choose armour layer ${i + 1}`;
  document.getElementById("pkFilters").innerHTML = have[i] ? `<button type="button" data-unlayer="${i}">Remove layer</button>` : "";
  const list = LAYERS.map(l => ({ l, s: layerScore(l, cls, b) })).sort((x, y) => y.s - x.s);
  document.getElementById("pkBody").innerHTML = `<p class="note" style="margin:6px 0">Ranked for this build. Rarer layers are stronger; brooches trade one stat for another.</p>` + list.map((x, n) => `<button type="button" class="gi${have[i] === x.l.n ? " on" : ""}" data-layer="${i}" data-n="${esc(x.l.n)}">
    ${x.l.icon ? `<img src="${x.l.icon}" alt="" class="ii lay">` : "<span></span>"}<span><span class="n r-${esc(x.l.r || "Common")}">${esc(x.l.n)}</span>
    <div class="stats">${esc(x.l.d || "")}</div><div class="meta">${esc(x.l.r)}${x.l.how ? " · " + esc(x.l.how) : ""}</div>
    ${n < 3 ? `<div class="chips"><span class="chip rec">${n === 0 ? "Best for this build" : "Good fit"}</span></div>` : ""}</span></button>`).join("");
  picker.hidden = false; tip.hidden = true;
}
function renderLayers(b) {
  const have = layersOf(b);
  if (!ITEM[gearOf(b).armour]) return `<p class="note">Equip body armour to add armour layers.</p>`;
  const pl = planOf(b);
  return `<div class="layers">${[0, 1, 2].map(i => { const l = LAYER[have[i]]; return `<div class="lrow${l && pl["layer" + i] ? " planned" : ""}"><button type="button" class="lslot" data-lslot="${i}">
    <span class="box sq">${l?.icon ? `<img src="${l.icon}" alt="">` : `<span class="tag">+</span>`}</span><span><b>${l ? esc(l.n) : `Layer ${i + 1}`}</b><span class="meta">${l ? esc(l.d) : "Empty"}</span></span></button>
    ${l ? `<button type="button" class="btn small" data-ltoggle="${i}">${pl["layer" + i] ? "Planned" : "Have"}</button>` : ""}</div>`; }).join("")}</div>
    <p class="note">Armour layers are the reinforced plates and layers you fit onto body armour. Armour holds up to 3; how many slots yours has depends on its quality (superior forging and blacksmith alterations add slots). Tap Planned/Have to switch.</p>`;
}
function sheetTotals(b) {
  const cls = byId[b.cls], base = (b.base ||= {})[b.cls] ||= {}, pl = planOf(b);
  const gear = {}, plan = {}, add = (t, v) => { for (const [k, x] of Object.entries(v)) t[k] = (t[k] || 0) + (+x || 0); };
  for (const [slot] of SLOTS) { const s = itemStats(b, slot); if (s) add(pl[slot] ? plan : gear, s.vals); }
  layersOf(b).forEach((n, i) => { if (LAYER[n]) add(pl["layer" + i] ? plan : gear, parseStats(LAYER[n].d)); });
  const job = {}, pf = PROFS.find(p => p.n === jobOf(b)), rank = (b.rank ||= {})[b.cls] ?? 4;
  if (pf) add(job, parseStats(pf.ranks[rank][0].replace(/\bSTR\b/, "Strength").replace(/\bDEX\b/, "Dexterity").replace(/\bCON\b/, "Constitution").replace(/\bWIL\b/, "Willpower").replace(/Crit Hit/, "Critical Hit")));
  return { base, gear, plan, job, rank, pf };
}
function renderSheet(cls, b) {
  const { base, gear, plan, job, rank, pf } = sheetTotals(b);
  const now = k => (+base[k] || 0) + (gear[k] || 0) + (job[k] || 0), fut = k => now(k) + (plan[k] || 0);
  const moveTarget = MOVE_TARGET[cls.id] || 18, main = cls.stat === "Strength" ? "str" : "dex";
  const anyPlan = Object.values(plan).some(Boolean);
  const chk = (label, k, target, mode) => {
    const n = now(k), f = fut(k), ok = v => mode === "max" ? v <= target : v >= target;
    return `<div class="${ok(n) ? "pro" : ok(f) ? "plan-ok" : "con"}">${ok(n) ? "✓" : ok(f) ? "◐" : "✗"} ${label}: ${n}${mode === "max" ? "%" : ""}${f !== n ? ` now, ${f}${mode === "max" ? "%" : ""} planned` : ""} / ${target}${mode === "max" ? "%" : ""}</div>`;
  };
  const row = ([k, n, u]) => { const d = (plan[k] || 0); return `<div class="cs-row${k === main ? " main" : ""}"><span>${k === "a" ? `<img class="ri" src="${SMALL.res.armour}" alt="">` : ""}${n}</span>
    ${["a", "g"].includes(k) ? `<span class="v dim">–</span>` : `<input type="number" inputmode="numeric" data-base="${k}" value="${base[k] ?? ""}" placeholder="0" aria-label="${n} without gear">`}
    <b class="v">${now(k)}${u || ""}</b><span class="v fut">${d ? `${fut(k)}${u || ""} <small>${d > 0 ? "+" : ""}${d}</small>` : `${fut(k)}${u || ""}`}</span></div>`; };
  return `<section class="panel notes">
    <h2 class="h2">Character sheet</h2>
    <p>Enter this companion's own attributes from the game, without gear. <b>Now</b> adds gear and layers you have plus your profession bonus; <b>Planned</b> also adds everything marked as planned. Enter an item's real stats in Gear by tapping it.</p>
    <div class="cs"><div class="cs-row head"><span>Stat</span><span>Own</span><span class="v">Now</span><span class="v">Planned</span></div>
      ${STAT_KEYS.map(row).join("")}
      <div class="cs-row"><span>Health</span><span class="v dim">2 / Con.</span><b class="v">${now("con") * 2}</b><span class="v fut">${fut("con") * 2}</span></div></div>
    ${!anyPlan ? `<p class="note">No planned gear yet. Plan items in Gear to see where this character is heading.</p>` : ""}
    ${pf ? `<div class="row"><span class="meta">${esc(pf.n)} rank:</span>${["Novice", "Apprentice", "Experienced", "Journeyman", "Master"].map((r, i) => `<button type="button" class="btn small${rank === i ? " primary" : ""}" data-rank-i="${i}">${r}</button>`).join("")}</div>` : `<p class="note">Choose a profession in Stats & Job to include its bonus.</p>`}
    <div class="checks">${chk("Willpower", "wil", 15)}${chk("Movement", "mv", moveTarget)}${chk("Critical Hit", "crit", 100, "max")}</div>
    <p class="note">✓ reached now · ◐ reached with planned gear · ✗ not yet. 15 Willpower gives a death save; Movement target for a ${cls.name} is ${moveTarget}; Critical Hit above 100% is wasted.</p>
  </section>${renderNotes(b)}`;
}

const app = document.getElementById("app");

const img = (i, cls = "", alt = "") => i != null && ICONS[i] ? `<img src="${ICONS[i]}" alt="${esc(alt)}" class="${cls}" loading="lazy">` : "";
const costIcons = n => typeof n === "number" && n ? `<span class="cost" title="${n} Valor Point${n > 1 ? "s" : ""}">${img(VALOR_IC).repeat(n)}</span>` : "";

function optDetail(o, lv, chosen) {

  return `<div class="d-h"><b>${esc(o.name)}</b>${o.skill ? `<span class="sub">${esc(o.skill)}${o.note ? ` (${esc(o.note.toLowerCase())})` : ""}</span>` : ""} ${costIcons(o.cost)} ${tags}</div>

function skBtn(o, lv, on, isFocus, small) {

function renderSpec(cls, b) {

function itemRow(it, opts = {}) {
  // Base Armour/Guard per weight class from game.wiki's crafting tables; the game scales them with item level
  const base = BASE_DEF[it.s === "offhand" ? (it.k === "shield" ? "shield" : "") : it.s + "-" + it.k];
  const exA = String(it.a || "").match(/^\+?(\d+) \((?:level|lvl) (\d+)\)/);
  const defTxt = base ? [`Base Armour ${base.a}`, base.g ? `Guard ${base.g}` : "", base.m ? `Movement ${base.m > 0 ? "+" : ""}${base.m}` : ""].filter(Boolean).join(" · ")
    + ` <span class="ex">(${base.label} base; grows with item level${exA ? `; wiki example at item level ${exA[2]}: Armour ${exA[1]}` : ""})</span>` : "";
  // Drop stat entries the base line already covers (armour Movement) or that the wiki marks unknown (+??)
  const bonus = String(it.st || "").split(/,\s*/).filter(x => x && !/\?\?/.test(x) && !(base?.m && /Movement/.test(x))).join(", ");
  const st = [it.d ? `Damage ${esc(it.d)}` : "", defTxt, bonus ? esc(bonus) : ""].filter(Boolean).join(" · ");
  const meta = [it.r, KIND_NAME[it.k], it.t != null && it.t > 0 ? `Tier ${it.t} (${TIERS[it.t - 1].name})` : ""].filter(Boolean).join(" · ");
  return `<button type="button" class="gi${opts.on ? " on" : ""}" ${opts.attr || ""}>${img(it.ic, "ii")}<span>

    <div class="meta">${esc(meta)}${it.how ? ` · ${esc(it.how)}` : ""}</div>
    ${st ? `<div class="stats">${st}</div>` : ""}
    ${(it.fx || []).map(([n, d]) => `<div class="fx"><i>${esc(n)}</i>: ${txt(d)}</div>`).join("")}
    ${opts.why?.length ? `<div class="chips">${opts.rec ? `<span class="chip rec">Recommended</span>` : ""}${opts.why.map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>` : ""}
  </span></button>`;
}

function renderEquip(cls, b) {

  const planSlots = [["weapon", "Weapon"], ["armour", "Armour"], ["helmet", "Helmet"], ...(allowedKinds(cls, b, "offhand").includes("shield") ? [["offhand", "Shield"]] : [])];

    <p class="blurb"><b style="font-style:normal;color:var(--ink);font-weight:600">${cls.name}</b> · ${esc(cls.role)} · ${esc(cls.weapon)} · ${esc(cls.stat)}. Starting skills: ${cls.start.map(esc).join(", ")}.</p>
  </section>
  <div class="tabs" role="tablist">${[["spec", "Skills"], ["equip", "Gear"], ["stats", "Stats & Job"], ["notes", "Sheet"]].map(([id, l]) => `<button type="button" class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${l}</button>`).join("")}</div>
  ${S.tab === "equip" ? renderEquip(cls, b) : S.tab === "stats" ? renderStats(cls, b) : S.tab === "notes" ? renderSheet(cls, b) : renderSpec(cls, b)}
  <p class="foot">Skills, items, professions and status effects from the Wartales Fandom wiki; specialisations, unlocks, crafting tiers and stat mechanics from game.wiki (October 2026). Trust the game if numbers differ. Fan-made; Wartales is by Shiro Games.</p>`);
}

/* ---------- Side drawer: party list and shopping list ---------- */
const drawer = document.getElementById("drawer");
let drawerTab = null;
function renderDrawer() {
  document.querySelectorAll("[data-drawer]").forEach(x => x.setAttribute("aria-pressed", x.dataset.drawer === drawerTab));
  document.getElementById("dtabsL").classList.toggle("open", drawerTab === "party");
  document.getElementById("dtabsR").classList.toggle("open", drawerTab === "shop");
  // While one side's panel is open, hide the other side's tab
  document.getElementById("dtabsL").classList.toggle("away", drawerTab === "shop");
  document.getElementById("dtabsR").classList.toggle("away", drawerTab === "party");
  if (drawerTab) drawer.classList.toggle("left", drawerTab === "party");
  if (!drawerTab) { drawer.classList.remove("open"); setTimeout(() => { if (!drawerTab) drawer.hidden = true; }, 220); return; }
  drawer.hidden = false; requestAnimationFrame(() => drawer.classList.add("open"));
  document.getElementById("drTitle").textContent = drawerTab === "party" ? (S.party.name || "Party") : "Shopping list";
  const b0 = cur();
  document.getElementById("drBody").innerHTML = decoHTML(drawerTab === "party"
    ? S.builds.map(b => { const rank = b.id === S.party.captain ? "Captain" : b.id === S.party.lieutenant ? "Lieutenant" : ""; return `<button type="button" class="member${b.id === b0.id ? " on" : ""}" data-open="${b.id}">
        <span class="portrait sm">${img(byId[b.cls].ic)}</span><span class="mi"><span class="n">${esc(b.name || "Unnamed")}</span>${rank ? ` <span class="chip rec">${rank}</span>` : ""}
        <span class="meta">${esc(titleOf(b))} lvl ${b.level}${jobOf(b) ? " · " + esc(jobOf(b)) : ""}</span></span></button>`; }).join("")
      + `<div class="row" style="justify-content:center;margin-top:8px"><button type="button" class="btn small primary" id="drAdd">+ Add companion</button></div>`
    : renderPins(true) + `<h2 class="h2" style="margin-top:10px">Materials</h2>` + renderShopTable());
}
const tip = document.getElementById("tip"), picker = document.getElementById("picker");
function showTip(key) {
  if (!GLOSS[key]) return;
  document.getElementById("tipTitle").innerHTML = (SMALL.status[key] ? `<img class="ti" src="${SMALL.status[key]}" alt="">` : "") + esc(key);
  document.getElementById("tipBody").innerHTML = decoHTML(`<p>${linkify(esc(GLOSS[key]))}</p>` + (key === "Censer" ? CENSERS.map(c =>
    `<p><b>${esc(c.n)}</b> <i>(${esc(c.by)})</i><br>Inhalation: ${linkify(esc(c.inh))}<br>Purge: ${linkify(esc(c.pur))}</p>`).join("") : ""));
  tip.hidden = false;
}
function showItem(name) {
  const it = ITEM[name]; if (!it) return;
  const b = cur(), cls = byId[b.cls], kinds = allowedKinds(cls, b, it.s), ok = kinds.includes(it.k);
  document.getElementById("tipTitle").textContent = it.n;
  const eqSlot = SLOTS.map(x => x[0]).find(sl => gearOf(b)[sl] === it.n);
  document.getElementById("tipBody").innerHTML = decoHTML(itemRow(it) + (eqSlot ? statEditor(b, eqSlot) : "") + `<div class="how">${howToGet(it)}</div>`) + `<div class="d-act">${RECIPES[it.n] ? `<button type="button" class="btn small" data-pin="${esc(it.n)}">${pinFor(it.n, b.id) ? `Pinned for ${esc(b.name)} ✓` : `Pin recipe for ${esc(b.name)}`}</button>` : ""}
    ${eqSlot ? `<button type="button" class="btn small primary" data-equip="${esc(it.n)}" data-st="${planOf(b)[eqSlot] ? "have" : "plan"}">${planOf(b)[eqSlot] ? "I have it now" : "Mark as planned"}</button>`
      : ok ? `<button type="button" class="btn small" data-equip="${esc(it.n)}" data-st="plan">Plan it</button><button type="button" class="btn primary small" data-equip="${esc(it.n)}" data-st="have">Equip (I have it)</button>` : ""}</div>`;
  tip.hidden = false;
}
function openPicker(slot) {
  pkSlot = slot; renderPicker(); picker.hidden = false; tip.hidden = true;
}
function renderPicker() {
  const b = cur(), cls = byId[b.cls], gear = gearOf(b), kinds = allowedKinds(cls, b, pkSlot);
  const list = ranked(cls, b, pkSlot, kinds);
  const label = SLOTS.find(s => s[0] === pkSlot)[1];
  document.getElementById("pkTitle").textContent = `Choose ${label.toLowerCase()}`;
  const F = [["rec", "Recommended"], ["all", "All"], ["craft", "Crafted"], ["unique", "Unique"]];
  document.getElementById("pkFilters").innerHTML = F.map(([id, l]) => `<button type="button" data-filter="${id}" aria-pressed="${pkFilter === id}">${l}</button>`).join("")
    + (gear[pkSlot] ? `<button type="button" data-unequip="1">Remove item</button>` : "");
  let shown = list;
  if (pkFilter === "rec") shown = list.slice(0, 8);
  if (pkFilter === "craft") shown = list.filter(x => /^Crafted|^Starting/.test(x.i.how || ""));
  if (pkFilter === "unique") shown = list.filter(x => x.i.r === "Legendary" || /^Unique/.test(x.i.how || ""));
  document.getElementById("pkBody").innerHTML = decoHTML((kinds.length ? `<p class="note" style="margin:6px 0">${kinds.map(k => KIND_NAME[k]).join(", ")} · ${list.length} items</p>` : "")
    + shown.map((x, n) => itemRow(x.i, { attr: `data-info="${esc(x.i.n)}"`, why: x.why, rec: n < 3 && pkFilter !== "unique" && x.score > 2, on: gear[pkSlot] === x.i.n })).join("")
    || `<p class="note">Nothing here for this class.</p>`);
}

/* ---------- Events ---------- */
function say(t, err) { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = "status" + (err ? " err" : ""); } }
function copy(text) {
  const box = document.getElementById("codeBox"); box.value = text;
  const fallback = () => { box.select(); say("The code is in the box below. Select it and copy."); };
  try { navigator.clipboard.writeText(text).then(() => say("Copied. Paste it anywhere to keep it."), fallback); } catch { fallback(); }
}
const keep = fn => { const y = window.scrollY; fn(); save(); render(); window.scrollTo(0, y); };

document.addEventListener("click", e => {
  const term = e.target.closest(".term");
  if (term) { showTip(term.dataset.term); return; }
  const dt = e.target.closest("[data-drawer]");
  if (dt) { drawerTab = drawerTab === dt.dataset.drawer ? null : dt.dataset.drawer; renderDrawer(); return; }
  if (e.target.closest("#drClose")) { drawerTab = null; renderDrawer(); return; }
  const op = e.target.closest("#drawer [data-open]");
  if (op) { S.active = op.dataset.open; S.mode = "char"; drawerTab = null; save(); render(); renderDrawer(); window.scrollTo(0, 0); return; }
  if (e.target.closest("#drAdd")) { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; S.mode = "char"; S.tab = "spec"; drawerTab = null; save(); render(); renderDrawer(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); return; }
  if (drawerTab && !e.target.closest("#drawer") && !e.target.closest(".sheet")) { drawerTab = null; renderDrawer(); }
  const close = e.target.closest("[data-close]");
  if (close) { document.getElementById(close.dataset.close).hidden = true; return; }
  const lay = e.target.closest("#picker [data-layer]");
  if (lay) { const b = cur(); keep(() => { layersOf(b)[+lay.dataset.layer] = lay.dataset.n; planOf(b)["layer" + lay.dataset.layer] = true; }); picker.hidden = true; return; }
  const unl = e.target.closest("[data-unlayer]");
  if (unl) { const b = cur(); keep(() => { layersOf(b)[+unl.dataset.unlayer] = undefined; }); picker.hidden = true; return; }
  const ires = e.target.closest("[data-ireset]");
  if (ires) { const b = cur(); delete istatsOf(b)[ires.dataset.ireset]; save(); showItem(gearOf(b)[ires.dataset.ireset]); render(); return; }
  const inf = e.target.closest("#picker [data-info]");
  if (inf) { showItem(inf.dataset.info); return; }
  const mat = e.target.closest("[data-mat]");
  if (mat && !e.target.closest("#app input")) { showMat(mat.dataset.mat); return; }
  const pin = e.target.closest("[data-pin]");
  if (pin) { const n = pin.dataset.pin, bid = cur().id, ex = pinFor(n, bid); if (ex) S.shop.list.splice(S.shop.list.indexOf(ex), 1); else S.shop.list.push({ n, b: bid, q: 1 }); save(); showItem(n); render(); return; }
  const pv = e.target.closest("[data-pinview]");
  if (pv) { S.shop.view = pv.dataset.pinview; save(); render(); if (drawerTab) renderDrawer(); return; }
  const pq = e.target.closest("[data-pinq]");
  if (pq) { const x = S.shop.list[+pq.dataset.pinq]; if (x) { x.q = Math.min(99, x.q + +pq.dataset.d); if (x.q <= 0) S.shop.list.splice(+pq.dataset.pinq, 1); } save(); render(); return; }
  const eq = e.target.closest("[data-equip]");
  if (eq) { const it = ITEM[eq.dataset.equip], b = cur(); keep(() => { gearOf(b)[it.s] = it.n; planOf(b)[it.s] = eq.dataset.st === "plan"; }); picker.hidden = true; tip.hidden = true; return; }
  if (e.target.closest("[data-unequip]")) { keep(() => { delete gearOf(cur())[pkSlot]; }); picker.hidden = true; return; }
  const f = e.target.closest("[data-filter]");
  if (f) { pkFilter = f.dataset.filter; renderPicker(); document.getElementById("pkBody").scrollTop = 0; return; }
  if (!e.target.closest(".sheet")) { if (!e.target.closest("[data-info], [data-mat]")) tip.hidden = true; if (!e.target.closest("[data-slot], [data-lslot]")) picker.hidden = true; }
  else if (e.target.closest("#picker") && !e.target.closest("#tip")) tip.hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { tip.hidden = true; picker.hidden = true; } });

app.addEventListener("click", e => {
  if (e.target.closest(".term")) return;
  const t = e.target.closest("button"); if (!t) return;
  const b = cur(), cls = byId[b.cls], p = picksOf(b);
  if (t.dataset.mode) return keep(() => { S.mode = t.dataset.mode; });
  if (t.id === "clearShop") return keep(() => { S.shop = { list: [], have: {} }; });
  if (t.dataset.mat) return;
  if (t.dataset.open) return keep(() => { S.active = t.dataset.open; S.mode = "char"; });
  if (t.dataset.rank) return keep(() => { const other = t.dataset.rank === "captain" ? "lieutenant" : "captain"; if (S.party[other] === t.dataset.id) delete S.party[other]; S.party[t.dataset.rank] = t.dataset.id; });
  if (t.id === "addMember") { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; S.mode = "char"; S.tab = "spec"; save(); render(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); return; }
  if (t.dataset.own) return keep(() => { const o = S.camp.own; if (o[t.dataset.own]) delete o[t.dataset.own]; else o[t.dataset.own] = 1; });
  if (t.dataset.tier) return keep(() => { S.camp.own[t.dataset.tier] = +t.dataset.n; });
  if (t.dataset.camp) return keep(() => { S.camp.manual = t.dataset.camp === "manual"; if (S.camp.manual && !Object.keys(S.camp.assign).length) S.camp.assign = assignCamp(S.builds).out; });
  if (t.dataset.cls) return keep(() => { b.cls = t.dataset.cls; delArm = false; });
  if (t.dataset.tab) return keep(() => { S.tab = t.dataset.tab; });
  if (t.dataset.pick) {
    const lv = t.dataset.pick, id = t.dataset.id;
    if (lv === "12s") return keep(() => { p[12] = id; focus[12] = "cs"; });
    if (id === "cs") return keep(() => { focus[12] = "cs"; if (!p[12] || optsFor(cls, cls.tiers.find(x => x.lv === 12)).some(o => o.id === p[12])) p[12] = "cs"; });
    return keep(() => { p[lv] = id; focus[lv] = id; });
  }
  if (t.dataset.clear) return keep(() => { delete p[t.dataset.clear]; delete focus[t.dataset.clear]; });
  if (t.dataset.style) return keep(() => { const g = gearOf(b); g.style = t.dataset.style; if (g.style === "two") delete g.offhand; const w = ITEM[g.weapon]; if (w && !allowedKinds(cls, b, "weapon").includes(w.k)) delete g.weapon; });
  if (t.dataset.slot) return openPicker(t.dataset.slot);
  if (t.dataset.lslot) return openLayerPicker(+t.dataset.lslot);
  if (t.dataset.ltoggle) return keep(() => { const k = "layer" + t.dataset.ltoggle, pl = planOf(b); pl[k] = !pl[k]; });
  if (t.dataset.rankI) return keep(() => { (b.rank ||= {})[b.cls] = +t.dataset.rankI; });
  if (t.dataset.job) return keep(() => { b.job[cls.id] = b.job[cls.id] === t.dataset.job ? undefined : t.dataset.job; });
  if (t.dataset.info) return showItem(t.dataset.info);
  switch (t.id) {
    case "lvUp": return keep(() => { b.level = Math.min(20, b.level + 1); });
    case "lvDown": return keep(() => { b.level = Math.max(1, b.level - 1); });
    case "copyOne": return copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify({ build: b, custom: { [b.cls]: S.custom[b.cls] || {} } })))));
    case "copyAll": return copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))));
    case "loadCode": return loadCode();
    case "delBtn":
      if (!delArm) { delArm = true; return render(); }
      delArm = false;
      return keep(() => { for (const r of ["captain", "lieutenant"]) if (S.party[r] === b.id) delete S.party[r]; S.builds = S.builds.filter(x => x.id !== b.id); if (!S.builds.length) S.builds.push(newBuild()); S.active = S.builds[0].id; });
  }
});
app.addEventListener("change", e => {
  const sid = e.target.dataset?.assign; if (!sid) return;
  keep(() => { const a = S.camp.assign; for (const k of Object.keys(a)) a[k] = (a[k] || []).filter(id => id !== e.target.value || k === sid); a[sid] = e.target.value ? [e.target.value] : []; });
});
document.addEventListener("input", e => {
  const d = e.target.dataset || {};
  if (d.have) {
    S.shop.have[d.have] = Math.max(0, +e.target.value || 0); save();
    const m = d.have, get = Math.max(0, (shoppingList()[m] || 0) - S.shop.have[m]);
    document.querySelectorAll(`[data-have="${CSS.escape(m)}"]`).forEach(inp => { const row = inp.closest(".sh-row"); if (inp !== e.target) inp.value = S.shop.have[m] || ""; row.querySelector(".get").textContent = get || "✓"; row.classList.toggle("done", !get); });
    return;
  }
  if (d.istat) {
    const b = cur(), it = ITEM[gearOf(b)[d.istat]]; if (!it) return;
    const st = istatsOf(b), cur0 = itemStats(b, d.istat);
    st[d.istat] = { item: it.n, vals: { ...cur0.vals, [d.k]: e.target.value === "" ? undefined : +e.target.value } };
    save(); if (S.tab === "notes") { const y = window.scrollY; render(); window.scrollTo(0, y); }
  }
});
app.addEventListener("input", e => {
  if (e.target.dataset?.base) {
    const b = cur(); ((b.base ||= {})[b.cls] ||= {})[e.target.dataset.base] = e.target.value === "" ? undefined : +e.target.value; save();
    clearTimeout(window.__rt); window.__rt = setTimeout(() => { const f = document.activeElement?.dataset?.base, y = window.scrollY; render(); window.scrollTo(0, y); if (f) { const el = document.querySelector(`[data-base="${f}"]`); el?.focus(); const v = el?.value; if (el) { el.value = ""; el.value = v; } } }, 500);
    return;
  }

  const b = cur();
  if (e.target.id === "partyName") { S.party.name = e.target.value.trim() ? e.target.value : ""; save(); const h = e.target.nextElementSibling; if (h) h.textContent = `${S.party.name || "Your party"} · ${S.builds.length} ${S.builds.length === 1 ? "companion" : "companions"}`; return; }
  if (e.target.id === "nameIn") { b.name = e.target.value; save(); const o = document.querySelector(`#buildSel option[value="${b.id}"]`); if (o) o.textContent = `${b.name || "Unnamed"} · ${byId[b.cls].name}`; }
  if (e.target.id === "notesIn") { b.notes = e.target.value; save(); }
});
function loadCode() {
  const raw = document.getElementById("codeBox").value.trim().replace(/^WTB1:/, "");
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (data.builds) { S = { tab: "spec", custom: {}, ...data }; for (const x of S.builds) { x.gear ||= {}; x.job ||= {}; } }
    else if (data.build && byId[data.build.cls]) {
      const nb = { gear: {}, job: {}, ...data.build, id: uid() }; S.builds.push(nb); S.active = nb.id;
      for (const [cid, tiers] of Object.entries(data.custom || {})) for (const [lv, list] of Object.entries(tiers || {})) {
        const dst = ((S.custom[cid] ||= {})[lv] ||= []);
        for (const o of list) if (!dst.some(x => x.id === o.id)) dst.push(o);
      }
    } else throw 0;
    save(); render(); say("Build loaded.");
  } catch { say("That code didn't load. Paste the whole code, starting with WTB1:", true); }
}
function newBuild() { return { id: uid(), name: "New mercenary", cls: cur()?.cls || "warrior", level: 1, notes: "", picks: {}, gear: {}, job: {} }; }
document.getElementById("newBtn").addEventListener("click", () => { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; S.tab = "spec"; delArm = false; save(); render(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); });
document.getElementById("buildSel").addEventListener("change", e => { S.active = e.target.value; delArm = false; save(); render(); window.scrollTo(0, 0); });

render();
</script>
