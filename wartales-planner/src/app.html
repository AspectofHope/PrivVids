<title>Wartales Build Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: the in-game character sheet folded into one phone column. Hero card (name, class, level), tab boxes, then the
   specialisation tree as "Lvl" rows of icons, or the equipment paper-doll. Single dark look by design, matching the game. */
:root {
  --bg: #242220;          /* weathered stone */
  --panel: #191816;
  --panel-hi: #211f1c;
  --tab: #141312;
  --line: #48443e;        /* Lvl rules and frames */
  --ink: #e4ded0;
  --muted: #9a9387;
  --dim: #6b665d;
  --gold: #c6a564;        /* accent: selection ring */
  --gold-hi: #ecd59d;
  --green: #8ab55f;
  --red: #cf5a40;
  --r-common: #d8d2c4; --r-unusual: #86b65a; --r-rare: #5f95dc; --r-legendary: #b984e0;
  --serif: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.4;
  background:
    radial-gradient(140% 90% at 50% 0%, rgba(255,255,255,.035), transparent 55%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--tab); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--tab); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.brand { font-weight: 600; font-size: 1.15rem; line-height: 1; margin-right: auto; white-space: nowrap; letter-spacing: .02em; }
.brand small { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
.bar select { min-width: 0; max-width: 48vw; padding: 6px 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 0; }

main { max-width: 640px; margin: 0 auto; padding-block: 14px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }

/* Panels: flat dark slabs with a hairline frame, as in the game */
.panel { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 6px 18px rgba(0,0,0,.35); }
.btn { border: 1px solid var(--line); background: #2b2926; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--gold); }
.btn.primary { border-color: var(--gold); color: var(--gold-hi); background: #2f2a20; }
.btn.danger { color: var(--red); }
.btn.small { padding: 4px 10px; font-size: .92rem; white-space: nowrap; }

/* Hero: name, class line, level */
.hero { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.hero-top { display: flex; gap: 12px; align-items: flex-start; }
.portrait { width: 64px; height: 64px; flex: none; background: radial-gradient(circle at 50% 40%, #3a3631, #141312 75%); border: 1px solid var(--line); display: grid; place-items: center; }
.portrait img { width: 40px; height: 40px; filter: invert(.86) sepia(.25); }
.who { flex: 1; min-width: 0; }
.name { width: 100%; font-size: 1.7rem; font-weight: 500; line-height: 1.1; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 0 0 2px; }
.name:focus { border-bottom-color: var(--line); outline: none; }
.classline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 1.02rem; margin-top: 2px; flex-wrap: wrap; }
.classline img { width: 20px; height: 20px; filter: invert(.7) sepia(.2); }
.classline b { color: var(--ink); font-weight: 500; }
.levelrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); background: var(--tab); }
.stepper button { width: 42px; height: 40px; border: 0; background: transparent; font-size: 1.3rem; color: var(--gold); }
.stepper output { min-width: 74px; text-align: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stepper output span { color: var(--muted); font-size: .9rem; }
.next { flex: 1; min-width: 170px; font-size: .98rem; color: var(--muted); }
.next b { color: var(--ink); font-weight: 600; }
.next strong { color: var(--red); font-weight: 600; }
.points { display: inline-flex; align-items: center; gap: 4px; color: var(--gold-hi); font-weight: 600; }
.classes { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.cls { aspect-ratio: 1; border: 1px solid var(--line); background: var(--tab); display: grid; place-items: center; padding: 0; }
.cls img { width: 62%; height: 62%; filter: invert(.55) sepia(.2); }
.cls[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 10px rgba(198,165,100,.3); }
.cls[aria-pressed="true"] img { filter: invert(.92) sepia(.5) saturate(1.6); }
.blurb { margin: 0; font-size: .95rem; color: var(--muted); font-style: italic; }

/* Tab boxes like the game's panel titles */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.tab { background: var(--tab); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 9px 2px; font-size: .98rem; font-weight: 500; color: var(--muted); line-height: 1.1; }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -2px 0 var(--gold); }

/* Specialisation tree */
.tree { padding: 6px 12px 14px; }
.lvrow { padding-top: 14px; }
.rule { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 1.02rem; }
.rule::before, .rule::after { content: ""; flex: 1; height: 7px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; }
.rule .st { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.rule .st.due { color: var(--red); } .rule .st.picked { color: var(--green); } .rule .st.planned { color: var(--gold); }
.icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 12px; padding: 12px 0 8px; }
.sk { position: relative; width: 54px; height: 54px; padding: 0; border: 0; background: none; }
.sk > img { width: 54px; height: 54px; display: block; filter: grayscale(1) brightness(.5) contrast(1.1); transition: filter .15s; }
.sk:hover > img { filter: grayscale(.6) brightness(.75); }
.sk.on > img { filter: drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 1.5px var(--gold)) drop-shadow(0 0 1.5px var(--gold)) drop-shadow(0 0 6px rgba(236,213,157,.55)); }
.sk.focus:not(.on) > img { filter: grayscale(.2) brightness(.85); }
.sk .vp { position: absolute; right: -3px; bottom: -3px; display: flex; gap: 0; }
.sk .vp img { width: 15px; height: 15px; filter: none; }
.sk.small, .sk.small > img { width: 46px; height: 46px; }
.detail { margin: 2px 2px 0; padding: 10px 12px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.05); }
.detail .hint { color: var(--dim); font-style: italic; font-size: .95rem; margin: 0; text-align: center; }
.d-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.d-h b { font-size: 1.15rem; font-weight: 600; }
.d-h .sub { color: var(--muted); font-style: italic; }
.cost { display: inline-flex; gap: 1px; vertical-align: middle; }
.cost img { width: 17px; height: 17px; }
.tag { font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; }
.tag.hidden { color: var(--red); border-color: var(--red); }
.desc { margin: 6px 0 0; font-size: .98rem; color: #d3ccbd; }
.up { display: flex; gap: 6px; margin-top: 6px; font-size: .94rem; color: var(--muted); }
.up img { width: 15px; height: 15px; margin-top: 3px; flex: none; }
.info { margin-top: 6px; font-size: .8rem; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
.where { margin-top: 6px; color: var(--red); font-size: .94rem; }
.d-act { display: flex; justify-content: flex-end; margin-top: 8px; gap: 8px; }
.subpick { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.subpick > p.lead { margin: 0; color: var(--muted); font-size: .92rem; text-align: center; }

.term { border-bottom: 1px dotted var(--gold); cursor: help; }

/* Equipment */
.equip { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.h2 { margin: 0; text-align: center; font-weight: 500; font-size: 1.1rem; background: var(--tab); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 6px; }
.style { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.style button { border: 1px solid var(--line); background: var(--tab); padding: 8px 6px; line-height: 1.15; }
.style button small { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
.style button[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.style .rec { color: var(--gold-hi); }
.why { margin: 0; font-size: .92rem; color: var(--muted); font-style: italic; text-align: center; }
.doll { display: grid; grid-template-columns: repeat(3, 84px); grid-template-areas: ". helmet ." "weapon armour offhand" "belt . backpack"; justify-content: center; gap: 10px 14px; }
.slot { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; }
.slot .box { width: 72px; height: 72px; background: radial-gradient(circle, #2b2825, #161513); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 0 14px rgba(0,0,0,.7); display: grid; place-items: center; position: relative; }
.slot .box img { width: 62px; height: 62px; object-fit: contain; }
.slot.tall .box { height: 116px; }
.slot.tall .box img { height: 106px; }
.slot .box .ph { width: 30px; height: 30px; opacity: .25; filter: invert(1); }
.slot .box.r-Common { box-shadow: inset 0 0 0 1px var(--r-common), inset 0 0 14px rgba(0,0,0,.6); }
.slot .box.r-Unusual { box-shadow: inset 0 0 0 1px var(--r-unusual), inset 0 0 14px rgba(0,0,0,.6); }
.slot .box.r-Rare { box-shadow: inset 0 0 0 1px var(--r-rare), inset 0 0 14px rgba(0,0,0,.6); }
.slot .box.r-Legendary { box-shadow: inset 0 0 0 1px var(--r-legendary), inset 0 0 14px rgba(0,0,0,.6); }
.slot small { font-size: .8rem; color: var(--muted); }
.slot[disabled] { opacity: .35; cursor: not-allowed; }
.gearlist { display: flex; flex-direction: column; }
.gi { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 9px 2px; border-top: 1px solid rgba(255,255,255,.06); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.gi img.ii { width: 48px; height: 64px; object-fit: contain; }
.gi .n { font-weight: 600; font-size: 1.02rem; }
.n.r-Common { color: var(--r-common); } .n.r-Unusual { color: var(--r-unusual); } .n.r-Rare { color: var(--r-rare); } .n.r-Legendary { color: var(--r-legendary); }
.meta { font-size: .86rem; color: var(--muted); }
.stats { font-size: .9rem; color: #cfc8b8; }
.fx { font-size: .92rem; color: #cfc8b8; margin-top: 2px; }
.fx i { color: var(--gold); font-style: normal; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: .76rem; letter-spacing: .03em; color: var(--gold-hi); border: 1px solid rgba(198,165,100,.5); padding: 0 6px; }
.chip.rec { background: rgba(198,165,100,.16); }
.plan { display: flex; flex-direction: column; }
.plan-row { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(0, 1fr)); gap: 6px; align-items: start; padding: 8px 4px; border-top: 1px solid rgba(255,255,255,.06); }
.plan-row.head { border-top: 0; padding-block: 0 4px; color: var(--muted); font-size: .82rem; }
.plan-row.now { background: rgba(198,165,100,.09); box-shadow: inset 2px 0 0 var(--gold); }
.plan-row .lvl { font-size: .9rem; line-height: 1.15; }
.plan-row.now .lvl { color: var(--gold-hi); }
.pc { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; text-align: center; min-width: 0; width: 100%; }
.pc img { width: 40px; height: 54px; object-fit: contain; }
.pc span { font-size: .74rem; line-height: 1.1; color: #cfc8b8; overflow-wrap: anywhere; }
.note { margin: 0; font-size: .86rem; color: var(--dim); font-style: italic; }

/* Stats & job tab */
.stats-tab { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.focus { margin: 0; text-align: center; font-size: 1.05rem; }
.focus b { color: var(--gold-hi); font-weight: 600; }
.prio { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.prio li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.prio .num { width: 26px; height: 26px; transform: rotate(45deg); border: 1px solid var(--line); display: grid; place-items: center; margin-top: 3px; background: var(--tab); }
.prio .num span { transform: rotate(-45deg); font-size: .85rem; font-variant-numeric: tabular-nums; }
.prio .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prio .top b { font-size: 1.08rem; font-weight: 600; }
.lvl-chip { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; border: 1px solid currentColor; }
.lvl-chip.High { color: var(--gold-hi); } .lvl-chip.Medium { color: var(--muted); } .lvl-chip.Low { color: var(--dim); }
.prio p { margin: 3px 0 0; font-size: .95rem; color: #cfc8b8; }
.prio .tgt { color: var(--green); font-size: .9rem; margin-top: 3px; }
.growth { display: flex; flex-direction: column; gap: 5px; }
.gr { display: grid; grid-template-columns: 96px 1fr 40px; gap: 8px; align-items: center; font-size: .92rem; }
.gr .bar { height: 8px; background: rgba(255,255,255,.06); }
.gr .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8a7448, var(--gold)); }
.gr .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.job { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 9px 2px; border: 0; border-top: 1px solid rgba(255,255,255,.06); background: none; text-align: left; width: 100%; }
.job img { width: 48px; height: 48px; }
.job.on { background: rgba(198,165,100,.1); box-shadow: inset 3px 0 0 var(--gold); }
.job .n { font-weight: 600; font-size: 1.05rem; }
.job .mb { color: var(--green); font-size: .92rem; }
.ranks { font-size: .8rem; color: var(--dim); margin-top: 2px; }

/* Party and camp */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #000; background: var(--tab); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.modes button { border: 0; background: none; padding: 9px 4px; font-size: 1.02rem; color: var(--muted); letter-spacing: .02em; }
.modes button[aria-selected="true"] { color: var(--gold-hi); box-shadow: inset 0 -2px 0 var(--gold); background: rgba(198,165,100,.07); }
.members { display: flex; flex-direction: column; }
.member { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px 2px; border: 0; border-top: 1px solid rgba(255,255,255,.06); background: none; text-align: left; width: 100%; }
.portrait.sm { width: 44px; height: 44px; }
.portrait.sm img { width: 28px; height: 28px; }
.mi .n { font-weight: 600; font-size: 1.05rem; }
.mi .meta { display: block; }
.roles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.rl { display: flex; flex-direction: column; align-items: center; background: var(--tab); border: 1px solid var(--line); padding: 5px 2px; }
.rl b { font-size: 1.25rem; font-weight: 600; color: var(--gold-hi); line-height: 1.1; font-variant-numeric: tabular-nums; }
.rl span { font-size: .7rem; color: var(--muted); letter-spacing: .02em; }
.rl.zero b { color: var(--dim); }
.pro { color: var(--green); font-size: .94rem; margin: 2px 0 0; }
.con { color: var(--red); font-size: .94rem; margin: 2px 0 0; }
.lead { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.jobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.jc { display: grid; grid-template-columns: 32px 1fr; gap: 6px; align-items: center; background: var(--tab); border: 1px solid var(--line); padding: 4px 6px; }
.jc img { width: 32px; height: 32px; }
.jc b { font-weight: 600; font-size: .95rem; display: block; line-height: 1.1; }
.jc .meta { display: block; font-size: .8rem; line-height: 1.15; }
.jc.zero { opacity: .55; }
.structs { display: flex; flex-direction: column; }
.st-row { padding: 9px 2px; border-top: 1px solid rgba(255,255,255,.06); }
.st-row.off { opacity: .55; }
.st-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-h b { font-weight: 600; font-size: 1.04rem; }
.sti { width: 22px; height: 22px; }
.own { width: 24px; height: 24px; border: 1px solid var(--line); background: var(--tab); color: var(--gold-hi); padding: 0; font-size: .9rem; line-height: 1; }
.own[aria-pressed="true"] { border-color: var(--gold); }
.tiers { margin-left: auto; display: inline-flex; gap: 3px; }
.tiers button { border: 1px solid var(--line); background: var(--tab); font-size: .8rem; padding: 1px 6px; color: var(--muted); }
.tiers button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); }
.who2 { margin-top: 4px; }
select.as { margin-top: 5px; width: 100%; padding: 5px 8px; border: 1px solid var(--line); background: #11100f; }

/* Notes tab */
.notes { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.notes p { margin: 0; color: var(--muted); font-size: .95rem; }
textarea.box { width: 100%; min-height: 110px; border: 1px solid var(--line); background: #11100f; padding: 8px 10px; resize: vertical; }
textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .76rem; min-height: 80px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.status { font-size: .92rem; color: var(--green); min-height: 1.2em; }
.status.err { color: var(--red); }
.foot { font-size: .84rem; color: var(--dim); text-align: center; font-style: italic; margin: 0; }

/* Bottom sheets: item picker and tooltips */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.sheet.tip { z-index: 30; }
.sheet-in { pointer-events: auto; max-width: 620px; margin: 0 auto; background: linear-gradient(180deg, #24221f, #171614); border: 1px solid #000;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 -8px 30px rgba(0,0,0,.7); display: flex; flex-direction: column; max-height: 78vh; }
.sheet.tip .sheet-in { max-height: 55vh; box-shadow: inset 0 0 0 1px var(--gold), 0 -8px 30px rgba(0,0,0,.7); }
.sh-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sh-h b { flex: 1; font-size: 1.15rem; font-weight: 600; }
.x { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--tab); font-size: 1.3rem; line-height: 1; color: var(--gold); }
.sh-b { overflow-y: auto; padding: 4px 12px 12px; }
.sheet.tip .sh-b { padding-top: 10px; }
.sh-b > p { margin: 0 0 6px; }
.sh-b > p b { color: var(--gold); }
.sh-b > p i { color: var(--muted); }
.filters { display: flex; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--tab); padding: 3px 10px; font-size: .9rem; }
.filters button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); }
.gi.on { background: rgba(198,165,100,.1); box-shadow: inset 3px 0 0 var(--gold); }
@media (prefers-reduced-motion: reduce) { .sk > img { transition: none; } }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand">Wartales<small>Build planner</small></div>
  <select id="buildSel" aria-label="Choose build"></select>
  <button class="btn primary small" id="newBtn" type="button">+ New</button>
</div></header>

<main id="app"></main>

<div id="picker" class="sheet" role="dialog" aria-labelledby="pkTitle" hidden>
  <div class="sheet-in">
    <div class="sh-h"><b id="pkTitle"></b><button type="button" class="x" data-close="picker" aria-label="Close">×</button></div>

<script>
/* ---------- Data: skills and status effects from the Wartales Fandom wiki; specializations, unlocks and crafting tiers from game.wiki (October 2026) ---------- */

// Weapon kinds per class: one = one-handed main hand (frees the off-hand), two = two-handed
const GEAR = {

};
const KIND_NAME = { axe1: "One-handed axe", axe2: "Two-handed axe", sword1: "One-handed sword", sword2: "Two-handed sword", mace1: "One-handed mace", mace2: "Two-handed mace",
  dagger: "Dagger", polearm: "Polearm", bow: "Bow", crossbow: "Crossbow", brawl: "Brawling weapon", censer: "Censer",
  shield: "Shield", throw: "Throwing weapon", melee: "Off-hand weapon", bomb: "Bomb or flask", torch: "Torch",

// Build keywords: what the chosen skills care about, matched against item effects
const KEYS = [

  ["Guard", /\bguard\b/i], ["Riposte", /riposte|counter-?attack/i], ["Fury", /\bfury\b/i], ["Rage", /\brage\b/i], ["Protection", /protection|damage taken (is )?reduced|deflection/i],
  ["Attacks of opportunity", /attacks? of opportunity/i], ["Vulnerability", /vulnerab/i], ["Weakening", /weaken/i], ["Fragility", /fragil/i],
  ["Area attacks", /area|all (the )?(units|enemies|targets)|multiple units|several enemies|each unit in/i], ["Knockback", /knock|push(es)? (them|the target)? ?back/i],
  ["Movement", /movement/i], ["Valor", /\bVP\b|valou?r/i], ["Healing", /\bheal/i], ["Attacks from behind", /from behind|ambush/i],
  ["Inhalation", /inhal|purge/i], ["Reloading", /reload|loaded/i], ["Disarm", /disarm/i], ["Slowdown", /slowdown/i], ["Animals", /animal/i], ["Stances", /stance/i],
];

/* ---------- Glossary helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const GLOSS_KEY = Object.fromEntries(Object.keys(GLOSS).map(k => [k.toLowerCase(), k]));
const GLOSS_RE = new RegExp("\\b(" + Object.keys(GLOSS).sort((a, b) => b.length - a.length)
  .flatMap(k => /\s/.test(k) || k === "Critical Hit" ? [k, k.toLowerCase()] : [k])
  .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")((?:e?s)?)\\b", "g");
const linkify = html => html.replace(GLOSS_RE, (m, term) => {
  const key = GLOSS_KEY[term.toLowerCase()];
  return key ? `<span class="term" data-term="${key}">${m}</span>` : m;
});
const txt = s => linkify(esc(String(s || "").replace(/\s*\/\s*\/\s*/g, " ").replace(/\s+\/\s+/g, " · ")));

/* ---------- State ---------- */
const KEY = "wartales-planner-v1";
const uid = () => Math.random().toString(36).slice(2, 9);
function sample() {
  return {
    active: "ex1", tab: "spec",
    builds: [{ id: "ex1", name: "Example: Berserker", cls: "warrior", level: 6, notes: "Example build. Rename it or tap + New to start your own.",
      picks: { warrior: { 2: "warrior-berserker", 3: "warrior-valorous-duel", 5: "warrior-recklessness", 8: "warrior-battle-cry" } }, gear: {} }],
    custom: {},
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { S = sample(); }
if (!S.builds?.length) S = sample();
S.custom ||= {}; S.tab ||= "spec"; S.mode ||= "char"; S.party ||= {}; S.camp ||= { own: null, assign: {} }; S.camp.own ||= { fire: 1, tent: 1, pot: 1, workshop: 1, gurney: 1, dummy: 1, table: 1 }; S.camp.assign ||= {};
S.builds = S.builds.filter(b => byId[b.cls]);
if (!S.builds.length) S = sample();
const ITEM = Object.fromEntries(ITEMS.map(i => [i.n, i]));
for (const b of S.builds) {
  b.gear ||= {}; b.job ||= {};
  for (const [cid, p] of Object.entries(b.picks || {})) {
    const c = byId[cid];
    for (const lv of Object.keys(p)) if (!c || !(p[lv] === "cs" || findOpt(c, p[lv]))) delete p[lv];
  }
  for (const g of Object.values(b.gear)) for (const k of Object.keys(g)) if (k !== "style" && !ITEM[g[k]]) delete g[k];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const cur = () => S.builds.find(b => b.id === S.active) || S.builds[0];
const picksOf = b => (b.picks[b.cls] ||= {});
const gearOf = b => (b.gear[b.cls] ||= {});
function optsFor(cls, tier) {
  const extra = (S.custom[cls.id] && S.custom[cls.id][tier.lv]) || [];
  return [...tier.opts, ...extra.map(o => ({ ...o, custom: true }))];
}
function findOpt(cls, id) {
  for (const t of cls.tiers) { const o = optsFor(cls, t).find(o => o.id === id); if (o) return o; }
}
function skipped(cls, b) {
  const p = picksOf(b);
  return cls.tiers.filter(t => t.lv < 12).flatMap(t => optsFor(cls, t).filter(o => o.id !== p[t.lv]).map(o => ({ ...o, from: t.lv })));
}
function status(b, t) {
  const p = picksOf(b)[t.lv];
  if (b.level >= t.lv) return p ? "picked" : "due";
  return p ? "planned" : "open";
}
const STATUS_TEXT = { picked: "Taken", due: "Pick now", planned: "Planned", open: "" };
const chosenOpts = (cls, b) => Object.values(picksOf(b)).map(id => findOpt(cls, id)).filter(Boolean);

/* ---------- Recommendations ---------- */
function profile(cls, b) {
  const prof = {};
  for (const o of chosenOpts(cls, b)) {
    const text = [o.name, o.skill, o.desc, o.up].join(" ");
    for (const [k, re] of KEYS) if (re.test(text)) prof[k] = (prof[k] || 0) + 1;
  }
  return prof;
}
function armourWeights(cls, b) {
  const p = picksOf(b), spec = cls.tiers.find(t => t.kind === "spec");
  const so = spec && findOpt(cls, p[spec.lv]);
  const w = (so?.armor || "").toLowerCase();
  if (w === "heavy") return { list: ["heavy", "medium", "light"], best: "heavy", from: so.name };
  if (w === "medium") return { list: ["medium", "light"], best: "medium", from: so.name };
  if (w === "light") return { list: ["light"], best: "light", from: so.name };
  return { list: ["light"], best: "light", from: "" };
}
function styleRec(cls, b, prof) {
  const g = GEAR[cls.id];
  if (!(g.one && g.two)) return null;
  const def = (prof["Guard"] || 0) + (prof["Protection"] || 0) + (prof["Riposte"] || 0);
  const aoe = (prof["Area attacks"] || 0) + (prof["Critical hits"] || 0) * 0.5;
  const style = def > aoe ? "one" : "two";
  const why = style === "one"
    ? (def ? `Your picks use ${["Guard", "Protection", "Riposte"].filter(k => prof[k]).join(", ")}, which a shield supports.` : "A shield adds Guard and Armour.")
    : (aoe ? `Your picks favour ${["Area attacks", "Critical hits"].filter(k => prof[k]).join(" and ").toLowerCase()}, where two-handed damage pays off.` : "Two-handed weapons hit harder; pick skills to refine this.");
  return { style, why };
}
function allowedKinds(cls, b, slot) {
  const g = GEAR[cls.id], gear = gearOf(b);
  if (slot === "weapon") return [g[(gear.style || styleRec(cls, b, profile(cls, b))?.style || (g.two ? "two" : "one"))] || g.one || g.two].filter(Boolean);
  if (slot === "offhand") {
    const style = gear.style || styleRec(cls, b, profile(cls, b))?.style || (g.two ? "two" : "one");
    return g.off && (style === "one" || !g.two) ? g.off : [];
  }
  if (slot === "armour" || slot === "helmet") return armourWeights(cls, b).list;
  return [slot];
}
function scoreItem(it, cls, b, prof, target) {
  let score = 0; const why = [];
  if (it.t != null) {
    const d = Math.abs(target - it.t); score += 3 - d * 1.3;
    if (d === 0) why.push(`Level ${TIERS[target - 1].lv} gear`);
  } else if (it.r === "Legendary") { score += 1.5; why.push("Unique, upgradable"); }
  else score += 0.5;
  const text = [it.st, ...(it.fx || []).flat()].join(" ");
  const hits = [];
  for (const [k, re] of KEYS) if (prof[k] && re.test(text)) { score += Math.min(prof[k], 3) * 1.1; hits.push(k); }
  if (hits.length) why.push("Fits: " + hits.slice(0, 3).join(", "));
  const main = cls.stat, other = main === "Strength" ? "Dexterity" : "Strength";
  if (it.st && new RegExp(main, "i").test(it.st)) { score += 1; why.push(`+${main}`); }
  if (it.st && new RegExp(other, "i").test(it.st)) score -= 1.5;
  if (it.d && new RegExp(other, "i").test(it.d)) score -= 2;
  if ((it.s === "armour" || it.s === "helmet")) {
    const aw = armourWeights(cls, b);
    if (it.k === aw.best) score += 1;
    if (aw.best === "heavy" && it.k !== "heavy" && (prof["Movement"] || prof["Attacks from behind"])) score += 0.8;

}
function ranked(cls, b, slot, kinds) {
  const prof = profile(cls, b), target = tierFor(b.level);
  return ITEMS.filter(i => i.s === slot && kinds.includes(i.k))
    .map(i => ({ i, ...scoreItem(i, cls, b, prof, target) }))
    .sort((x, y) => y.score - x.score || x.i.n.localeCompare(y.i.n));
}
function bestForTier(cls, b, slot, kinds, t) {
  const prof = profile(cls, b);
  const pool = ITEMS.filter(i => i.s === slot && kinds.includes(i.k) && i.t === t);
  return pool.map(i => ({ i, ...scoreItem(i, cls, b, prof, t) })).sort((x, y) => y.score - x.score)[0]?.i;

/* ---------- Stats and profession advice ---------- */
const FRONTLINE = ["warrior", "swordsman", "brute", "spearman", "pugilist"];
function statAdvice(cls, b) {
  const prof = profile(cls, b), main = cls.stat, other = main === "Strength" ? "Dexterity" : "Strength";
  const opts = chosenOpts(cls, b);
  const named = re => opts.filter(o => re.test([o.desc, o.up].join(" "))).map(o => o.name);
  const critPicks = named(/critical/i), tank = (prof["Guard"] || 0) + (prof["Protection"] || 0) + (prof["Riposte"] || 0);
  const behind = prof["Attacks from behind"] || 0, front = FRONTLINE.includes(cls.id);
  const aw = armourWeights(cls, b), moveTarget = MOVE_TARGET[cls.id] || 18;
  const armourMove = aw.best === "light" ? 2 : aw.best === "heavy" ? -2 : 0;
  const list = [];
  list.push({ stat: main, level: "High", score: 10,
    why: `All of the ${cls.name}'s damage skills scale with ${main}: each point adds 1 damage. It also raises ${main === "Strength" ? "Critical Damage" : "Critical Hit chance"} (up to +30%).`,
    tgt: `Push it with every level-up you can choose (Career Plans), the ${main === "Strength" ? "Blacksmith" : "Alchemist"} profession and gear with +${main}.` });
  const critHigh = critPicks.length > 0 || main === "Dexterity";
  list.push({ stat: "Critical Hit", level: critPicks.length ? "High" : main === "Dexterity" ? "Medium" : "Low", score: critPicks.length ? 9 : main === "Dexterity" ? 6 : 3,
    why: critPicks.length ? `Your picks ${critPicks.slice(0, 3).join(", ")} depend on critical hits.` : `Critical hits add ${main === "Strength" ? "your Critical Damage bonus" : "big spikes of damage"}, but none of your picks rely on them yet.`,
    tgt: critHigh ? "Aim for 100% late game; anything above is wasted. Sources: Dexterity, Willpower (+1% per 5), the Tinkerer profession (+12%), gear and food." : "Gear and food bonuses are enough for now." });
  list.push({ stat: "Willpower", level: front || tank ? "High" : "Medium", score: front || tank ? 8 : 5,
    why: "At 15 Willpower a unit gets a death save, and every 5 points add 1% Critical Hit. Higher Willpower also fills troop Morale faster. It doesn't grow on level-up for most classes.",
    tgt: "Get it to 15: base is 10, so +5 from the Scholar (+8), Angler or Bard (+4), traits, or the Bard's Lute (+1 for the whole troop)." });
  const moveHigh = cls.id === "ranger" || behind > 0 || cls.id === "pugilist";
  list.push({ stat: "Movement", level: moveHigh ? "High" : front ? "Medium" : "Low", score: moveHigh ? 8.5 : front ? 5.5 : 3,
    why: moveHigh ? `${behind ? "Your picks reward attacks from behind, so you need to reach the enemy's back." : `The ${cls.name} has to get into position each turn.`}` : front ? "Melee units need to reach their targets, but armour matters more." : "Ranged units mostly stay put; a little extra helps reach good firing spots.",
    tgt: `Target ${moveTarget}. Base is 10; ${aw.best} armour gives ${armourMove > 0 ? "+" : ""}${armourMove}.${cls.id === "ranger" ? " Rangers are the only class that can gain Movement on level-up." : ""}` });
  list.push({ stat: "Constitution", level: tank ? "Medium" : "Low", score: tank ? 4.5 : 2,
    why: "Each point gives 2 Health and some carrying capacity. Much combat damage is a percentage of maximum Health, so Armour and Guard protect you better than raw Health.",
    tgt: tank ? "Your build tanks hits, so take it when nothing better is offered." : "It grows on its own; don't spend choices on it." });
  list.push({ stat: other, level: "Low", score: 1,
    why: other === "Dexterity" ? "Your skills don't scale with Dexterity; it only adds a little Critical Hit chance." : "Your skills don't scale with Strength; it only adds a little Critical Damage.",
    tgt: "Skip it." });

}
function jobAdvice(cls, b) {
  const prof = profile(cls, b), main = cls.stat === "Strength" ? "str" : "dex", other = main === "str" ? "dex" : "str";
  const crit = (prof["Critical hits"] || 0) > 0, tank = (prof["Guard"] || 0) + (prof["Protection"] || 0) + (prof["Riposte"] || 0) > 0;
  const NAME = { str: "Strength", dex: "Dexterity", con: "Constitution", wil: "Willpower" };

}

      <div class="ranks">${["Novice", "Apprentice", "Experienced", "Journeyman", "Master"].map((r, i) => `${r} ${esc(x.p.ranks[i][0])}`).join(" · ")}</div></span></button>`).join("")}</div>
  </section>`;
}

const STRUCTS = [

    if (slot === "armour" || slot === "helmet") kinds = [aw.best];
    const it = bestForTier(cls, b, slot, kinds, T.t);
    return `<div>${it ? `<button type="button" class="pc" data-info="${esc(it.n)}">${img(it.ic)}<span>${esc(it.n)}</span></button>` : `<span class="meta">—</span>`}</div>`;
  }).join("")}</div>`).join("");
  const uniques = ["weapon", "offhand", "helmet"].flatMap(slot => ranked(cls, b, slot, allowedKinds(cls, b, slot)).filter(x => x.i.r === "Legendary").slice(0, slot === "weapon" ? 2 : 1));

  return `<section class="panel equip" aria-label="Equipment">
    <h2 class="h2">Equipment</h2>
    ${g.one && g.two ? `<div class="style" role="group" aria-label="Weapon style">
      ${["two", "one"].map(s => `<button type="button" data-style="${s}" aria-pressed="${style === s}">${s === "two" ? KIND_NAME[g.two] : KIND_NAME[g.one] + " + off-hand"}<small class="${rec?.style === s ? "rec" : ""}">${rec?.style === s ? "Recommended" : s === "two" ? "More damage" : "Shield or off-hand item"}</small></button>`).join("")}
    </div>${rec ? `<p class="why">${esc(rec.why)}</p>` : ""}` : ""}
    <div class="doll">${slotHtml}</div>
    <p class="note">Armour: ${aw.from ? `${esc(aw.from)} can wear ${aw.list.join(", ")} armour.` : "choose a specialisation at Lvl " + cls.tiers.find(t => t.kind === "spec").lv + " to see which armour weights this unit can wear."} Tap a slot to choose gear.</p>
    ${equipped.length ? `<div class="gearlist">${equipped.map(it => itemRow(it, { attr: `data-slot="${it.s}"` })).join("")}</div>` : ""}
    <h2 class="h2">Gear by level</h2>
    <p class="note">Best crafted or faction item for each blacksmith tier that matches your picks. Tiers unlock as your blacksmith ranks up, so treat the levels as a rough guide.</p>
    <div class="plan" style="--cols:${planSlots.length}"><div class="plan-row head"><div></div>${planSlots.map(([, l]) => `<div style="text-align:center">${l}</div>`).join("")}</div>${planRows}</div>
    ${uniques.length ? `<h2 class="h2">Legendary items worth getting</h2><div class="gearlist">${uniques.map(x => itemRow(x.i, { attr: `data-info="${esc(x.i.n)}"`, why: x.why })).join("")}</div>` : ""}
  </section>`;
}

function renderNotes(b) {
  return `<section class="panel notes">
    <h2 class="h2">Notes</h2>
    <textarea class="box" id="notesIn" placeholder="Attributes to raise, profession, party role…">${esc(b.notes)}</textarea>
    <h2 class="h2">Back up &amp; share</h2>
    <p>Builds are saved on this device only. Copy a code to keep a backup or send a build to a friend, and paste a code to load it.</p>
    <div class="row"><button class="btn small" type="button" id="copyOne">Copy this build</button><button class="btn small" type="button" id="copyAll">Copy everything</button></div>
    <textarea class="box code" id="codeBox" placeholder="Paste a build code here, then tap Load" aria-label="Build code"></textarea>
    <div class="row"><button class="btn small primary" type="button" id="loadCode">Load code</button>
      <button class="btn small danger" type="button" id="delBtn">${delArm ? "Tap again to delete" : "Delete this build"}</button></div>
    <div class="status" id="msg" role="status"></div>
  </section>`;
}

const MODES = [["char", "Character"], ["party", "Party"], ["camp", "Camp"]];
function render() {
  const b = cur(), cls = byId[b.cls], p = picksOf(b);
  document.getElementById("buildSel").innerHTML = S.builds.map(x => `<option value="${x.id}"${x.id === b.id ? " selected" : ""}>${esc(x.name || "Unnamed")} · ${byId[x.cls].name}</option>`).join("");
  const modes = `<div class="modes" role="tablist">${MODES.map(([id, l]) => `<button type="button" role="tab" data-mode="${id}" aria-selected="${S.mode === id}">${l}</button>`).join("")}</div>`;
  if (S.mode !== "char") { app.innerHTML = modes + (S.mode === "party" ? renderParty() : renderCamp()); return; }
  const spec = cls.tiers.find(t => t.kind === "spec"), so = findOpt(cls, p[spec.lv]);
  const mo = b.level >= 15 && findOpt(cls, p[15]);
  const due = cls.tiers.filter(t => status(b, t) === "due"), upcoming = cls.tiers.find(t => t.lv > b.level);
  let next = due.length ? `<strong>${due.length === 1 ? "1 choice" : due.length + " choices"} waiting:</strong> Lvl ${due.map(t => t.lv).join(", ")}`
    : upcoming ? `Next choice at <b>Lvl ${upcoming.lv}</b> · ${KIND_LABEL[upcoming.kind]}` : "Every milestone reached.";
  const rank = b.id === S.party.captain ? "Captain" : b.id === S.party.lieutenant ? "Lieutenant" : "";
  app.innerHTML = modes + `
  <section class="panel hero">
    <div class="hero-top">
      <div class="portrait">${img(cls.ic)}</div>
      <div class="who">
        <input id="nameIn" class="name" value="${esc(b.name)}" aria-label="Build name" placeholder="Name this mercenary">
        ${rank ? `<span class="chip rec" style="float:right">${rank}</span>` : ""}<div class="classline">${img(cls.ic)}<span><b>${esc(mo?.name || so?.name || cls.name)}</b> lvl ${b.level}${so || mo ? ` · ${cls.name}` : ""}${b.job[cls.id] ? ` · ${esc(b.job[cls.id])}` : ""}</span></div>
      </div>
    </div>
    <div class="levelrow">
      <div class="stepper" role="group" aria-label="Current level"><button type="button" id="lvDown" aria-label="Level down">−</button>
        <output id="lvOut" aria-live="polite"><span>Level</span> ${b.level}</output><button type="button" id="lvUp" aria-label="Level up">+</button></div>
      <div class="next">${due.length ? `<span class="points">${img(UP_IC)} ${due.length}</span> ` : ""}${next}</div>
    </div>
    <div class="classes" role="group" aria-label="Class">${CLASSES.map(c => `<button type="button" class="cls" data-cls="${c.id}" aria-pressed="${c.id === b.cls}" title="${c.name}" aria-label="${c.name}">${img(c.ic)}</button>`).join("")}</div>
    <p class="blurb"><b style="font-style:normal;color:var(--ink);font-weight:600">${cls.name}</b> · ${esc(cls.role)} · ${esc(cls.weapon)} · ${esc(cls.stat)}. Starting skills: ${cls.start.map(esc).join(", ")}.</p>
  </section>
  <div class="tabs" role="tablist">${[["spec", "Skills"], ["equip", "Gear"], ["stats", "Stats & Job"], ["notes", "Notes"]].map(([id, l]) => `<button type="button" class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${l}</button>`).join("")}</div>
  ${S.tab === "equip" ? renderEquip(cls, b) : S.tab === "stats" ? renderStats(cls, b) : S.tab === "notes" ? renderNotes(b) : renderSpec(cls, b)}
  <p class="foot">Skills, items, professions and status effects from the Wartales Fandom wiki; specialisations, unlocks, crafting tiers and stat mechanics from game.wiki (October 2026). Trust the game if numbers differ. Fan-made; Wartales is by Shiro Games.</p>`;
}

/* ---------- Sheets ---------- */
const tip = document.getElementById("tip"), picker = document.getElementById("picker");
function showTip(key) {
  if (!GLOSS[key]) return;
  document.getElementById("tipTitle").textContent = key;
  document.getElementById("tipBody").innerHTML = `<p>${linkify(esc(GLOSS[key]))}</p>` + (key === "Censer" ? CENSERS.map(c =>
    `<p><b>${esc(c.n)}</b> <i>(${esc(c.by)})</i><br>Inhalation: ${linkify(esc(c.inh))}<br>Purge: ${linkify(esc(c.pur))}</p>`).join("") : "");
  tip.hidden = false;
}
function showItem(name) {
  const it = ITEM[name]; if (!it) return;
  const b = cur(), cls = byId[b.cls], kinds = allowedKinds(cls, b, it.s), ok = kinds.includes(it.k);
  document.getElementById("tipTitle").textContent = it.n;
  document.getElementById("tipBody").innerHTML = itemRow(it) + (ok ? `<div class="d-act"><button type="button" class="btn primary small" data-equip="${esc(it.n)}">Equip</button></div>` : "");
  tip.hidden = false;
}
function openPicker(slot) {
  pkSlot = slot; renderPicker(); picker.hidden = false; tip.hidden = true;
}
function renderPicker() {
  const b = cur(), cls = byId[b.cls], gear = gearOf(b), kinds = allowedKinds(cls, b, pkSlot);
  const list = ranked(cls, b, pkSlot, kinds);
  const label = SLOTS.find(s => s[0] === pkSlot)[1];
  document.getElementById("pkTitle").textContent = `Choose ${label.toLowerCase()}`;
  const F = [["rec", "Recommended"], ["all", "All"], ["craft", "Crafted"], ["unique", "Unique"]];
  document.getElementById("pkFilters").innerHTML = F.map(([id, l]) => `<button type="button" data-filter="${id}" aria-pressed="${pkFilter === id}">${l}</button>`).join("")
    + (gear[pkSlot] ? `<button type="button" data-unequip="1">Remove item</button>` : "");
  let shown = list;
  if (pkFilter === "rec") shown = list.slice(0, 8);
  if (pkFilter === "craft") shown = list.filter(x => /^Crafted|^Starting/.test(x.i.how || ""));
  if (pkFilter === "unique") shown = list.filter(x => x.i.r === "Legendary" || /^Unique/.test(x.i.how || ""));
  document.getElementById("pkBody").innerHTML = (kinds.length ? `<p class="note" style="margin:6px 0">${kinds.map(k => KIND_NAME[k]).join(", ")} · ${list.length} items</p>` : "")
    + shown.map((x, n) => itemRow(x.i, { attr: `data-equip="${esc(x.i.n)}"`, why: x.why, rec: n < 3 && pkFilter !== "unique" && x.score > 2, on: gear[pkSlot] === x.i.n })).join("")
    || `<p class="note">Nothing here for this class.</p>`;
}

/* ---------- Events ---------- */
function say(t, err) { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = "status" + (err ? " err" : ""); } }
function copy(text) {
  const box = document.getElementById("codeBox"); box.value = text;
  const fallback = () => { box.select(); say("The code is in the box below. Select it and copy."); };
  try { navigator.clipboard.writeText(text).then(() => say("Copied. Paste it anywhere to keep it."), fallback); } catch { fallback(); }
}
const keep = fn => { const y = window.scrollY; fn(); save(); render(); window.scrollTo(0, y); };

document.addEventListener("click", e => {
  const term = e.target.closest(".term");
  if (term) { showTip(term.dataset.term); return; }
  const close = e.target.closest("[data-close]");
  if (close) { document.getElementById(close.dataset.close).hidden = true; return; }
  const eq = e.target.closest("[data-equip]");
  if (eq) { const it = ITEM[eq.dataset.equip], b = cur(); keep(() => { gearOf(b)[it.s] = it.n; }); picker.hidden = true; tip.hidden = true; return; }
  if (e.target.closest("[data-unequip]")) { keep(() => { delete gearOf(cur())[pkSlot]; }); picker.hidden = true; return; }
  const f = e.target.closest("[data-filter]");
  if (f) { pkFilter = f.dataset.filter; renderPicker(); document.getElementById("pkBody").scrollTop = 0; return; }
  if (!e.target.closest(".sheet")) { tip.hidden = true; if (!e.target.closest("[data-slot]")) picker.hidden = true; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { tip.hidden = true; picker.hidden = true; } });

app.addEventListener("click", e => {
  if (e.target.closest(".term")) return;
  const t = e.target.closest("button"); if (!t) return;
  const b = cur(), cls = byId[b.cls], p = picksOf(b);
  if (t.dataset.mode) return keep(() => { S.mode = t.dataset.mode; });
  if (t.dataset.open) return keep(() => { S.active = t.dataset.open; S.mode = "char"; });
  if (t.dataset.rank) return keep(() => { const other = t.dataset.rank === "captain" ? "lieutenant" : "captain"; if (S.party[other] === t.dataset.id) delete S.party[other]; S.party[t.dataset.rank] = t.dataset.id; });
  if (t.id === "addMember") { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; S.mode = "char"; S.tab = "spec"; save(); render(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); return; }
  if (t.dataset.own) return keep(() => { const o = S.camp.own; if (o[t.dataset.own]) delete o[t.dataset.own]; else o[t.dataset.own] = 1; });
  if (t.dataset.tier) return keep(() => { S.camp.own[t.dataset.tier] = +t.dataset.n; });
  if (t.dataset.camp) return keep(() => { S.camp.manual = t.dataset.camp === "manual"; if (S.camp.manual && !Object.keys(S.camp.assign).length) S.camp.assign = assignCamp(S.builds).out; });
  if (t.dataset.cls) return keep(() => { b.cls = t.dataset.cls; delArm = false; });
  if (t.dataset.tab) return keep(() => { S.tab = t.dataset.tab; });
  if (t.dataset.pick) {
    const lv = t.dataset.pick, id = t.dataset.id;
    if (lv === "12s") return keep(() => { p[12] = id; focus[12] = "cs"; });
    if (id === "cs") return keep(() => { focus[12] = "cs"; if (!p[12] || optsFor(cls, cls.tiers.find(x => x.lv === 12)).some(o => o.id === p[12])) p[12] = "cs"; });
    return keep(() => { p[lv] = id; focus[lv] = id; });
  }
  if (t.dataset.clear) return keep(() => { delete p[t.dataset.clear]; delete focus[t.dataset.clear]; });
  if (t.dataset.style) return keep(() => { const g = gearOf(b); g.style = t.dataset.style; if (g.style === "two") delete g.offhand; const w = ITEM[g.weapon]; if (w && !allowedKinds(cls, b, "weapon").includes(w.k)) delete g.weapon; });
  if (t.dataset.slot) return openPicker(t.dataset.slot);
  if (t.dataset.job) return keep(() => { b.job[cls.id] = b.job[cls.id] === t.dataset.job ? undefined : t.dataset.job; });
  if (t.dataset.info) return showItem(t.dataset.info);
  switch (t.id) {
    case "lvUp": return keep(() => { b.level = Math.min(20, b.level + 1); });
    case "lvDown": return keep(() => { b.level = Math.max(1, b.level - 1); });
    case "copyOne": return copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify({ build: b, custom: { [b.cls]: S.custom[b.cls] || {} } })))));
    case "copyAll": return copy("WTB1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))));
    case "loadCode": return loadCode();
    case "delBtn":
      if (!delArm) { delArm = true; return render(); }
      delArm = false;
      return keep(() => { for (const r of ["captain", "lieutenant"]) if (S.party[r] === b.id) delete S.party[r]; S.builds = S.builds.filter(x => x.id !== b.id); if (!S.builds.length) S.builds.push(newBuild()); S.active = S.builds[0].id; });
  }
});
app.addEventListener("change", e => {
  const sid = e.target.dataset?.assign; if (!sid) return;
  keep(() => { const a = S.camp.assign; for (const k of Object.keys(a)) a[k] = (a[k] || []).filter(id => id !== e.target.value || k === sid); a[sid] = e.target.value ? [e.target.value] : []; });
});
app.addEventListener("input", e => {
  const b = cur();
  if (e.target.id === "nameIn") { b.name = e.target.value; save(); const o = document.querySelector(`#buildSel option[value="${b.id}"]`); if (o) o.textContent = `${b.name || "Unnamed"} · ${byId[b.cls].name}`; }
  if (e.target.id === "notesIn") { b.notes = e.target.value; save(); }
});
function loadCode() {
  const raw = document.getElementById("codeBox").value.trim().replace(/^WTB1:/, "");
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (data.builds) { S = { tab: "spec", custom: {}, ...data }; for (const x of S.builds) { x.gear ||= {}; x.job ||= {}; } }
    else if (data.build && byId[data.build.cls]) {
      const nb = { gear: {}, job: {}, ...data.build, id: uid() }; S.builds.push(nb); S.active = nb.id;
      for (const [cid, tiers] of Object.entries(data.custom || {})) for (const [lv, list] of Object.entries(tiers || {})) {
        const dst = ((S.custom[cid] ||= {})[lv] ||= []);
        for (const o of list) if (!dst.some(x => x.id === o.id)) dst.push(o);
      }
    } else throw 0;
    save(); render(); say("Build loaded.");
  } catch { say("That code didn't load. Paste the whole code, starting with WTB1:", true); }
}
function newBuild() { return { id: uid(), name: "New mercenary", cls: cur()?.cls || "warrior", level: 1, notes: "", picks: {}, gear: {}, job: {} }; }
document.getElementById("newBtn").addEventListener("click", () => { const nb = newBuild(); S.builds.push(nb); S.active = nb.id; S.tab = "spec"; delArm = false; save(); render(); window.scrollTo(0, 0); document.getElementById("nameIn").select(); });
document.getElementById("buildSel").addEventListener("change", e => { S.active = e.target.value; delArm = false; save(); render(); window.scrollTo(0, 0); });

render();
</script>
